<style>
:root{
  --bg:#080B18;--bgimg:radial-gradient(900px 600px at 8% -5%,rgba(120,110,255,.22),transparent 60%),radial-gradient(700px 500px at 100% 0%,rgba(46,242,255,.16),transparent 60%),radial-gradient(800px 600px at 75% 110%,rgba(46,242,255,.10),transparent 60%);
  --panel:rgba(17,16,40,.78);--panel2:rgba(28,26,62,.9);--ink:#ECE9FF;--soft:#9A96C4;--line:rgba(139,120,255,.24);--hover:rgba(139,120,255,.10);
  --acc:#2EF2FF;--acc2:#9D6BFF;--amb:#FFC43D;--prod:#3DFF8E;--test:#FFA62B;--danger:#FF5C7A;--on-acc:#04121A;
  --dlg:#0E0D22;--grid-op:1;--hero-base:#0B1024;--hero-ink:#fff;--bldg:#070A16;--glow:1;
  --hfont:"Unbounded","Golos Text",system-ui,sans-serif;--save:linear-gradient(135deg,#2EF2FF,#7B8CFF);
}
:root[data-theme="light"]{
  --bg:#EEF1F4;--bgimg:linear-gradient(transparent,transparent);--panel:#FFFFFF;--panel2:#F7F9FB;--ink:#18202C;--soft:#5D6878;--line:#DDE2E8;--hover:#F2F5F8;
  --acc:#1F6FD1;--acc2:#5B4BD6;--amb:#B7791F;--prod:#1F8A4C;--test:#C27A0E;--danger:#B3261E;--on-acc:#fff;
  --dlg:#fff;--grid-op:0;--hero-base:#FFFFFF;--hero-ink:#18202C;--bldg:#C9D3DF;--glow:0;
  --hfont:"Golos Text",system-ui,sans-serif;--save:#18202C;
}
:root[data-theme="lavender"]{
  --bg:#F4F0FB;--bgimg:radial-gradient(800px 500px at 0% 0%,rgba(190,160,255,.35),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(255,180,220,.30),transparent 60%);
  --panel:rgba(255,255,255,.85);--panel2:#fff;--ink:#2A2140;--soft:#6F6590;--line:#E4DAF5;--hover:#F6F1FF;
  --acc:#7C5CFF;--acc2:#D0479B;--amb:#C07A12;--prod:#22975A;--test:#D2811A;--danger:#C6284F;--on-acc:#fff;
  --dlg:#fff;--grid-op:0;--hero-base:#FFFFFF;--hero-ink:#2A2140;--bldg:#D9CCF5;--glow:0;
  --hfont:"Unbounded","Golos Text",system-ui,sans-serif;--save:linear-gradient(135deg,#7C5CFF,#D0479B);
}
:root[data-theme="forest"]{
  --bg:#0D1613;--bgimg:radial-gradient(900px 600px at 0% 0%,rgba(80,200,150,.14),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(200,220,120,.08),transparent 60%);
  --panel:rgba(20,33,28,.85);--panel2:#1B2C25;--ink:#E3F1EA;--soft:#93AFA2;--line:rgba(120,200,160,.18);--hover:rgba(120,200,160,.08);
  --acc:#5FD3A0;--acc2:#B9D86A;--amb:#E8C15A;--prod:#6BE39A;--test:#F0A85A;--danger:#FF7B7B;--on-acc:#07140F;
  --dlg:#14211C;--grid-op:0;--hero-base:#11201A;--hero-ink:#F0FAF4;--bldg:#0A1410;--glow:.5;
  --hfont:"Golos Text",system-ui,sans-serif;--save:linear-gradient(135deg,#5FD3A0,#B9D86A);
}
:root[data-theme="sunset"]{
  --bg:#1A0F14;--bgimg:radial-gradient(900px 600px at 100% 0%,rgba(255,120,80,.22),transparent 60%),radial-gradient(800px 600px at 0% 100%,rgba(255,80,140,.14),transparent 60%);
  --panel:rgba(38,22,28,.85);--panel2:#2E1B22;--ink:#FBEDE6;--soft:#C9A79E;--line:rgba(255,150,120,.2);--hover:rgba(255,150,120,.08);
  --acc:#FF8A5B;--acc2:#FF5C9A;--amb:#FFC15E;--prod:#7BE29B;--test:#FFC15E;--danger:#FF6B6B;--on-acc:#1A0F14;
  --dlg:#24151B;--grid-op:0;--hero-base:#22131A;--hero-ink:#fff;--bldg:#13090D;--glow:.6;
  --hfont:"Unbounded","Golos Text",system-ui,sans-serif;--save:linear-gradient(135deg,#FF8A5B,#FF5C9A);
}
:root[data-theme="graphite"]{
  --bg:#121212;--bgimg:linear-gradient(transparent,transparent);--panel:#1B1B1B;--panel2:#222;--ink:#EDEDED;--soft:#9A9A9A;--line:#2C2C2C;--hover:#232323;
  --acc:#EDEDED;--acc2:#A8A8A8;--amb:#D4B76A;--prod:#8BD49B;--test:#E0A860;--danger:#F08080;--on-acc:#121212;
  --dlg:#1B1B1B;--grid-op:0;--hero-base:#1B1B1B;--hero-ink:#fff;--bldg:#0E0E0E;--glow:0;
  --hfont:"Golos Text",system-ui,sans-serif;--save:#EDEDED;
}
:root[data-theme="sakura"]{
  --bg:#FFF4F7;--bgimg:radial-gradient(800px 500px at 100% 0%,rgba(255,150,190,.30),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(190,140,255,.20),transparent 60%);
  --panel:rgba(255,255,255,.88);--panel2:#fff;--ink:#3A1F2E;--soft:#8C6478;--line:#F6D5E2;--hover:#FFEEF4;
  --acc:#F0508A;--acc2:#9B5CF0;--amb:#D9822B;--prod:#2E9E62;--test:#E0862A;--danger:#D12B4F;--on-acc:#fff;
  --dlg:#fff;--grid-op:0;--hero-base:#FFFFFF;--hero-ink:#3A1F2E;--bldg:#F8CFDE;--glow:0;
  --hfont:"Unbounded","Golos Text",system-ui,sans-serif;--save:linear-gradient(135deg,#F0508A,#9B5CF0);
}
:root[data-theme="matrix"]{
  --bg:#050A07;--bgimg:radial-gradient(900px 600px at 50% -10%,rgba(0,255,140,.12),transparent 60%);
  --panel:rgba(8,20,13,.85);--panel2:#0C1F14;--ink:#D6FFE8;--soft:#6FAF8C;--line:rgba(0,255,140,.18);--hover:rgba(0,255,140,.07);
  --acc:#00FF9C;--acc2:#4DD0FF;--amb:#E6FF5C;--prod:#00FF9C;--test:#FFC94D;--danger:#FF5C7A;--on-acc:#03140B;
  --dlg:#07130C;--grid-op:.5;--hero-base:#06120B;--hero-ink:#E8FFF2;--bldg:#020604;--glow:1;
  --hfont:"Unbounded","Golos Text",system-ui,sans-serif;--save:linear-gradient(135deg,#00FF9C,#4DD0FF);
}
:root{--e4:var(--acc);--e3:var(--acc2);--e2:var(--amb);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font:15px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bgimg),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:auto -20% 0 -20%;height:55vh;pointer-events:none;z-index:0;opacity:var(--grid-op);
  background:linear-gradient(transparent 0 calc(100% - 1px),rgba(46,242,255,.22) 0) 0 0/100% 46px,linear-gradient(90deg,transparent 0 calc(100% - 1px),rgba(157,107,255,.22) 0) 0 0/46px 100%;
  transform:perspective(420px) rotateX(62deg);transform-origin:bottom;mask-image:linear-gradient(to top,#000 10%,transparent 85%);-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{position:relative;z-index:1;display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;height:100vh;overflow:auto;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-family:var(--hfont);font-weight:600;font-size:14px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;color:var(--soft);position:relative}
.navbtn svg{flex:none;opacity:.85}.navbtn span{flex:1}.navbtn small{font-size:12px;color:var(--soft)}
.navbtn:hover{background:var(--hover);color:var(--ink)}
.navbtn.on{color:var(--ink);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.navbtn.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 calc(10px*var(--glow)) var(--acc)}
.navbtn.on svg{color:var(--acc);opacity:1}
.navsep{height:1px;background:var(--line);margin:10px 8px}
.navfoot{padding:12px 10px 0;display:flex;flex-direction:column;gap:6px}
.navfoot button{border:0;background:none;color:var(--soft);text-align:left;padding:2px 0;font-size:13px}
.navfoot button:hover{color:var(--acc)}
.sizeinfo{font-size:12px;color:var(--soft);opacity:.8;margin-bottom:4px}
.sizeinfo:empty{display:none}
main{padding:22px clamp(14px,3vw,40px) 80px;max-width:1080px;width:100%}
.top{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);backdrop-filter:blur(8px)}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent);outline:none}
.search svg{position:absolute;z-index:1;pointer-events:none;left:13px;top:50%;transform:translateY(-50%);color:var(--acc)}
.btn{border:1px solid var(--line);background:var(--panel);padding:10px 15px;border-radius:10px;font-weight:600;white-space:nowrap;backdrop-filter:blur(8px)}
.btn:hover{border-color:var(--acc2);background:var(--panel2)}
.btn.add{border-color:color-mix(in srgb,var(--acc) 60%,transparent);color:var(--acc)}
.btn.save{background:var(--save);border:0;color:var(--on-acc)}
.btn.save.clean{background:var(--panel);color:var(--soft);border:1px solid var(--line)}
.btn.save .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-left:8px;vertical-align:middle}
.btn.save.clean .dot{display:none}
.btn.danger{color:var(--danger)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.icon{padding:10px 12px}
.savehint{font-size:12px;color:var(--soft);min-height:18px;margin:0 0 6px;text-align:right}
.savehint.dirty{color:var(--acc)}
.hero{position:relative;overflow:hidden;border-radius:18px;margin:6px 0 18px;min-height:150px;display:flex;align-items:flex-end;
  background:linear-gradient(160deg,color-mix(in srgb,var(--a) 30%,var(--hero-base)) 0%,var(--hero-base) 72%);border:1px solid color-mix(in srgb,var(--a) 35%,transparent)}
.hero.plain{min-height:0;background:none;border:0;border-radius:0}
.scene{position:absolute;inset:0;pointer-events:none}
.scene svg{position:absolute;right:0;bottom:0;width:100%;height:100%}
.scene .bl{fill:var(--bldg)}
.hero-in{position:relative;display:flex;align-items:center;gap:16px;padding:22px 24px}
.hero.plain .hero-in{padding:0}
.htile{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,var(--a),color-mix(in srgb,var(--a) 45%,#3B2BFF));box-shadow:0 8px 26px color-mix(in srgb,var(--a) 40%,transparent)}
h1{font-family:var(--hfont);font-weight:600;font-size:clamp(22px,3.4vw,32px);line-height:1.1;margin:0 0 6px;color:var(--hero-ink)}
.sub{color:color-mix(in srgb,var(--hero-ink) 75%,transparent);margin:0;font-size:14px;max-width:42ch}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters .gap{width:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--soft)}
.chip:hover{color:var(--ink)}
.chip.on{color:var(--on-acc);background:var(--acc);border-color:var(--acc)}
.chip[data-eng="3"].on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.chip[data-eng="2"].on{background:var(--amb);border-color:var(--amb);color:#fff}
.group{margin:24px 0 8px;font-family:var(--hfont);font-size:12.5px;display:flex;align-items:center;gap:10px;color:var(--soft)}
.group::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.group .cnt{color:var(--acc)}
.list{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);position:relative}
.row:first-child{border-top:0}
.row:hover{background:var(--hover)}
.row:hover::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--acc)}
.tag{width:34px;height:34px;display:grid;place-items:center;font-family:var(--hfont);font-weight:600;font-size:14px;flex:none;border-radius:10px}
.t4{background:color-mix(in srgb,var(--e4) 16%,transparent);color:var(--e4)}
.t3{background:color-mix(in srgb,var(--e3) 18%,transparent);color:var(--e3)}
.t2{background:color-mix(in srgb,var(--e2) 18%,transparent);color:var(--e2)}
.t0{background:var(--hover);color:var(--soft)}
.name{font-weight:600;text-decoration:none;word-break:break-word;font-size:15.5px;color:var(--ink)}
a.name:hover{color:var(--acc)}
.meta{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin-top:2px;align-items:center}
.dom{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.env{font-weight:700;font-size:12px;padding:1px 8px;border-radius:999px}.env.prod{color:var(--prod);background:color-mix(in srgb,var(--prod) 15%,transparent)}.env.test{color:var(--test);background:color-mix(in srgb,var(--test) 15%,transparent)}
.chip[data-envf="prod"].on{background:var(--prod);border-color:var(--prod);color:#fff}.chip[data-envf="test"].on{background:var(--test);border-color:var(--test);color:#fff}
.gen{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px}
.gen.m{background:color-mix(in srgb,#4C8DFF 18%,transparent);color:#4C8DFF}
.gen.f{background:color-mix(in srgb,#FF5FA2 18%,transparent);color:#FF5FA2}
.stack{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pill{font-size:12px;border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:6px;padding:1px 8px}
.pill b{font-weight:700;color:var(--acc);margin-right:5px}
.pill.empty{opacity:.4;border-color:var(--line);background:none}.pill.empty b{color:var(--soft)}
.old .name{color:var(--soft);text-decoration:line-through}
.acts{display:flex;gap:2px}
.ib{border:0;background:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--soft)}
.ib:hover{background:var(--hover);color:var(--acc)}
.ib.star.on{color:#FFB020}.ib.star.on svg{fill:#FFB020}
.ib.pin.on{color:var(--acc)}.ib.pin.on svg{fill:color-mix(in srgb,var(--acc) 40%,transparent)}
.ib.star:not(.on),.ib.pin:not(.on){opacity:.45}.row:hover .ib.star,.row:hover .ib.pin{opacity:1}
.row.pinned{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.mark{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--acc)}
.sticky.pinned::before{width:16px;height:16px;border-radius:50%;top:-6px;background:radial-gradient(circle at 35% 35%,#FF8A8A,#D3263A);box-shadow:0 2px 3px rgba(0,0,0,.35);transform:translateX(-50%)}
.spin{border:0;background:none;color:rgba(43,38,32,.55);font-size:13px;padding:0}
.spin:hover,.spin.on{color:#D3263A}
@media (hover:none){.ib.star:not(.on),.ib.pin:not(.on){opacity:.7}}
.empty-state{padding:34px 20px;text-align:center;color:var(--soft);background:var(--panel);border:1px dashed var(--line);border-radius:14px}
.empty-state svg{color:var(--acc2);opacity:.7;margin-bottom:8px}
.empty-state .btn{margin-top:12px}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--dlg);color:var(--ink);width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(4,3,10,.55);backdrop-filter:blur(3px)}
.dlg{padding:22px;max-height:88vh;overflow:auto}
.dlg h2{margin:0 0 16px;font-family:var(--hfont);font-weight:600;font-size:17px;color:var(--ink)}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px;color:var(--soft)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--ink);font-size:15px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--acc);outline:none}
.f textarea{min-height:62px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.dlgfoot{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.dlgfoot .r{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:8px;font-size:14px;color:var(--soft)}
.seg button.on{background:var(--acc);color:var(--on-acc);font-weight:600}
.multi{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.multi .mh{font-size:13px;color:var(--soft);margin-bottom:7px;display:flex;justify-content:space-between}
.multi .mh b{color:var(--acc);font-weight:700}
.mopts{display:flex;flex-wrap:wrap;gap:6px}
.mopt{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink)}
.mopt.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.mopt.on::before{content:"✓ "}
.madd{display:flex;gap:6px;margin-top:8px}
.madd input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:none;font-size:13px}
.madd button{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;font-size:13px}
.lists{display:grid;gap:18px}
.lists h3{margin:0 0 8px;font-family:var(--hfont);font-weight:600;font-size:14px;color:var(--acc)}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchip{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 4px 4px 10px;font-size:14px}
.lchip button{border:0;background:none;color:var(--soft);width:22px;height:22px;border-radius:5px}
.lchip button:hover{color:var(--danger)}
.addl{display:flex;gap:6px;margin-top:8px;max-width:440px}
.addl input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.lock{max-width:400px;margin:20px 0;background:var(--panel);border:1px solid var(--line);padding:24px;border-radius:14px}
.lock h2{margin:0 0 6px;font-family:var(--hfont);font-weight:600;font-size:17px}
.lock p{color:var(--soft);font-size:14px;margin:0 0 14px}
.pw{font-family:ui-monospace,Consolas,monospace;font-size:14px;letter-spacing:.05em;color:var(--amb)}
/* вход */
.gated nav,.gated .mobilefoot{display:none}.gated .app{grid-template-columns:1fr}.gated main{margin:0 auto}
.gate{max-width:460px;margin:7vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;backdrop-filter:blur(10px)}
.gate h2{margin:0 0 6px;font-family:var(--hfont);font-weight:600;font-size:20px}
.gate p{color:var(--soft);font-size:14px;margin:0 0 16px}
.gate .btn{width:100%;margin-top:4px}
.gate .err{color:var(--danger);font-size:14px;min-height:20px;margin:6px 0 0}
.gate .small{font-size:12.5px;color:var(--soft);margin-top:14px;line-height:1.5}
.gate .lnk{border:0;background:none;color:var(--acc);padding:0;font-size:13px;margin-top:12px}
.gate .logo{width:52px;height:52px;margin-bottom:14px}
/* глаз на входе */
.eyebox{display:flex;flex-direction:column;align-items:center;margin:-6px 0 14px}
.logingif{display:none;max-width:240px;max-height:200px;width:auto;border-radius:20px;box-shadow:0 10px 30px rgba(255,92,168,.25)}
.hasgif .logingif{display:block}.hasgif .eyewrap{display:none}
.eyewrap{background:linear-gradient(160deg,#FFF0F7,#EFE6FF);border-radius:22px;padding:6px 26px 2px;box-shadow:0 10px 30px rgba(255,92,168,.25)}
.eye{width:200px;height:auto;display:block;overflow:visible}
.eye .blink{transform-origin:100px 60px;animation:blink 5.5s infinite}
.eye .look{animation:read 4.2s infinite ease-in-out}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.06)}}
@keyframes read{0%{transform:translate(-12px,-4px)}27%{transform:translate(10px,-4px)}33%{transform:translate(-12px,1px)}60%{transform:translate(10px,1px)}66%{transform:translate(-12px,6px)}93%{transform:translate(10px,6px)}100%{transform:translate(-12px,-4px)}}
.codewin{width:100%;max-width:360px;height:78px;overflow:hidden;border-radius:10px;background:#0E0A1C;border:1px solid rgba(255,92,168,.35);margin-top:12px;position:relative;
  font:12px/1.55 ui-monospace,Consolas,"Courier New",monospace;color:#E9E3FF;box-shadow:0 0 22px rgba(255,92,168,.18)}
.codewin::before,.codewin::after{content:"";position:absolute;left:0;right:0;height:16px;z-index:1}
.codewin::before{top:0;background:linear-gradient(#0E0A1C,transparent)}.codewin::after{bottom:0;background:linear-gradient(transparent,#0E0A1C)}
.codewin .scroll{padding:6px 12px;white-space:nowrap;animation:codescroll 14s linear infinite}
@keyframes codescroll{to{transform:translateY(-50%)}}
.k{color:#FF7AC6}.f{color:#7FE7FF}.s{color:#B6F27A}.c{color:#7D7499}.n{color:#FFC86B}
.gate .title{display:flex;align-items:center;gap:10px}
.beat{display:inline-block;width:26px;height:26px;animation:beat 1.1s infinite}
@keyframes beat{0%,40%,100%{transform:scale(1)}15%{transform:scale(1.22)}28%{transform:scale(1.05)}}
.brand .beat{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){.eye .blink,.eye .look,.codewin .scroll,.beat{animation:none}}
/* гифка в шапке */
.herogif{position:absolute;right:22px;top:50%;transform:translateY(-50%);height:118px;max-width:200px;object-fit:cover;border-radius:16px;
  border:2px solid color-mix(in srgb,var(--a) 55%,transparent);box-shadow:0 8px 28px color-mix(in srgb,var(--a) 40%,transparent)}
@media (max-width:620px){.herogif{display:none}}
/* база знаний */
dialog.wide{width:min(1000px,96vw)}
.doctext{width:100%;min-height:52vh;border:1px solid var(--line);border-radius:10px;padding:14px;background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--ink);
  font:13.5px/1.6 ui-monospace,Consolas,"Courier New",monospace;resize:vertical;tab-size:2}
.doctext:focus{outline:none;border-color:var(--acc)}
.doctext[readonly]{opacity:.85;border-style:dashed}
.docbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 8px;font-size:13px;color:var(--soft)}
.docbar .r{display:flex;gap:6px;flex-wrap:wrap}
.docbar button{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 10px;font-size:13px}
.docbar button:hover{border-color:var(--acc);color:var(--acc)}
.vers{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13px;color:var(--soft)}
.verwarn{font-size:13px;color:var(--test);margin:0 0 8px}
.ib.docs{width:auto;padding:0 8px;gap:4px;display:inline-flex;align-items:center}
.ib.docs small{font-size:12px;font-weight:700}
.ib.docs.has{color:var(--acc2)}
.dlist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.dlist button.dl{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:none;border-radius:10px;padding:10px 12px}
.dlist button.dl:hover{border-color:var(--acc)}
.dlist small{color:var(--soft)}
.pchip{font-size:12px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--acc2) 15%,transparent);color:var(--acc2)}
/* задачи */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:200px;backdrop-filter:blur(10px)}
.khead{display:flex;align-items:center;gap:8px;font-family:var(--hfont);font-weight:600;font-size:13px;padding:4px 4px 10px}
.khead .cnt{color:var(--soft);font-family:"Golos Text",sans-serif;font-weight:500}
.khead .kadd{margin-left:auto;border:1px solid var(--line);background:none;border-radius:8px;width:28px;height:28px;font-size:16px;line-height:1;color:var(--acc)}
.khead .kadd:hover{border-color:var(--acc)}
.kdot{width:9px;height:9px;border-radius:50%}
.kbody{display:flex;flex-direction:column;gap:8px;min-height:120px;border-radius:10px;padding:2px;transition:background .15s}
.kbody.over{background:color-mix(in srgb,var(--acc) 10%,transparent);outline:2px dashed color-mix(in srgb,var(--acc) 50%,transparent)}
.kcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab;position:relative}
.kcard:hover{border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.kcard.dragging{opacity:.4}
.kcard .kt{font-weight:600;word-break:break-word}
.kcard .kn{font-size:13px;color:var(--soft);margin-top:3px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kcard .km{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center;font-size:12px;color:var(--soft)}
.kcard .due.late{color:var(--danger);font-weight:600}
.kmove{display:flex;gap:4px;margin-top:8px}
.kmove button{border:1px solid var(--line);background:none;border-radius:6px;padding:2px 8px;font-size:12px;color:var(--soft)}
.kmove button:hover{color:var(--acc);border-color:var(--acc)}
.kcol[data-col="done"] .kt{text-decoration:line-through;color:var(--soft)}
.kclear{border:0;background:none;color:var(--soft);font-size:12px;margin-top:8px;padding:0}
.kclear:hover{color:var(--danger)}
@media (max-width:1100px){.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:640px){.kanban{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -14px;padding:0 14px 6px;scrollbar-width:none}.kanban::-webkit-scrollbar{display:none}.kcol{flex:0 0 84%;scroll-snap-align:center;min-height:0}.kbody{min-height:60px}}
/* журнал */
.jtype{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px}
.jt-change{background:color-mix(in srgb,#4DA3FF 18%,transparent);color:#4DA3FF}
.jt-fix{background:color-mix(in srgb,var(--prod) 18%,transparent);color:var(--prod)}
.jt-release{background:color-mix(in srgb,#B57CFF 20%,transparent);color:#B57CFF}
.jt-note{background:var(--hover);color:var(--soft)}
.jtext{white-space:pre-wrap;word-break:break-word;margin-top:2px}
/* свои вкладки */
.navadd{color:var(--soft);opacity:.75;font-size:14px}.navadd:hover{opacity:1}
.chip.addcat{border-style:dashed;display:inline-flex;align-items:center;gap:5px}
.icopick,.colpick{display:flex;flex-wrap:wrap;gap:6px}
.icopick button{width:38px;height:38px;border:1px solid var(--line);background:none;border-radius:10px;display:grid;place-items:center;color:var(--soft)}
.icopick button.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.colpick button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.colpick button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--dlg) inset}
.catlist{display:flex;flex-direction:column;gap:6px}
.catrow{display:flex;gap:4px;align-items:center}
.catrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--ink)}
.catrow .ib:disabled{opacity:.25;cursor:default}
/* выбор и перенос */
.selbox{width:18px;height:18px;accent-color:var(--acc);margin:0;cursor:pointer}
.row.selrow{grid-template-columns:auto auto 1fr auto}
.chip.addcat.on{border-style:solid}
.selbar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  max-width:min(900px,96vw);background:var(--dlg);border:1px solid var(--acc);border-radius:14px;padding:10px 12px;box-shadow:0 12px 40px rgba(0,0,0,.35);font-size:14px}
.selbar select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--ink);max-width:200px}
.selbar select option{background:var(--dlg)}
.selbar .btn{padding:8px 12px}
body:has(.selbar) .toast,body:has(.selbar) .errbar{bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.selbar .btn:disabled{opacity:.4;cursor:default}
.navadd{color:var(--acc)!important;opacity:1!important;border:1px dashed color-mix(in srgb,var(--acc) 45%,transparent)!important;margin:4px 0}
@media (max-width:780px){.row.selrow{grid-template-columns:auto auto 1fr}}
.btn.restorebtn{padding:6px 12px;font-size:13px;color:var(--acc)}
.navord{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.nrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 12px}
.nrow .nl{flex:1}
.nrow.issep{border-style:dashed;opacity:.7}
.sepl{font-size:12px;color:var(--soft);letter-spacing:.05em}
.nrow .ib:disabled{opacity:.25;cursor:default}
.vtimerbox{background:var(--panel);border:1px solid color-mix(in srgb,var(--amb) 45%,transparent);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.vtop{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:8px}
.vtimer{font-variant-numeric:tabular-nums;color:var(--amb)}
.vtimer.warn{color:var(--danger)}
.vbar{height:5px;border-radius:5px;background:var(--hover);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--amb);border-radius:5px;transition:width .25s linear}
.vbar i.warn{background:var(--danger)}
.vnav{font-size:12px;font-weight:600}
@media (prefers-reduced-motion:reduce){.vbar i{transition:none}}
/* прогресс */
.prog{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.pbar{flex:1;min-width:90px;max-width:260px;height:7px;border-radius:7px;background:var(--hover);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.prog.done .pbar i{background:var(--prod)}
.ptxt{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.prog.done .ptxt{color:var(--prod);font-weight:600}
.pbtn{border:1px solid var(--line);background:none;border-radius:7px;padding:2px 9px;font-size:12.5px;color:var(--ink)}
.pbtn:hover{border-color:var(--acc);color:var(--acc)}
/* привычки */
.hgrid{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;overflow-x:auto;backdrop-filter:blur(10px)}
.hhead,.hrow{display:grid;grid-template-columns:minmax(120px,1.4fr) repeat(var(--n),minmax(30px,1fr)) 44px 58px;gap:5px;align-items:center;min-width:calc(170px + var(--n)*35px + 110px)}
.hhead{font-size:11.5px;color:var(--soft);padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px}
.hd{text-align:center;line-height:1.15}.hd small{display:block;font-size:10px;opacity:.75}.hd.today{color:var(--acc);font-weight:700}
.hrow{padding:4px 0}
.hname{border:0;background:none;text-align:left;display:flex;align-items:center;gap:8px;font-weight:600;padding:4px 2px;min-width:0}
.hname span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hemoji{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--hc) 18%,transparent);flex:none;font-size:15px}
.hcell{aspect-ratio:1;min-height:30px;border-radius:9px;border:1px solid var(--line);background:none;color:#fff;font-weight:700;font-size:14px}
.hcell.today{border-color:color-mix(in srgb,var(--hc) 70%,transparent);border-width:2px}
.hcell.on{background:var(--hc);border-color:var(--hc);color:#06140c;box-shadow:0 0 calc(10px*var(--glow)) color-mix(in srgb,var(--hc) 60%,transparent)}
.hstreak{text-align:center;font-weight:700;color:#FF9F43}.hstreak.zero{color:var(--soft);opacity:.5}
.hweek{text-align:center;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}.hweek.ok{color:var(--prod);font-weight:700}
.hsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:14px}
.hcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--hc);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--soft)}
.hcard b{color:var(--ink);font-size:14px}
/* импорт закладок */
.bmlist{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.bmrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;color:var(--ink);font-size:14px;cursor:pointer}
.bmrow:hover{background:var(--hover)}.bmrow span{flex:1}.bmrow small{color:var(--soft)}
.bmrow input{accent-color:var(--acc);width:17px;height:17px}
/* дневник */
.dtoday{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid color-mix(in srgb,#FF8FB1 45%,transparent);background:linear-gradient(120deg,color-mix(in srgb,#FF8FB1 16%,var(--panel)),var(--panel));border-radius:16px;padding:14px 16px;margin-bottom:16px}
.dt-emo{font-size:30px;width:48px;height:48px;display:grid;place-items:center;background:color-mix(in srgb,#FF8FB1 18%,transparent);border-radius:14px;flex:none}
.dt-txt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.dt-txt span{color:var(--soft);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-go{font-size:22px;color:#FF8FB1}
.dmhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.dmhead b{font-family:var(--hfont);font-size:18px;text-transform:capitalize;min-width:150px;text-align:center}
.dmstat{color:var(--soft);font-size:13px;margin-left:8px}
.dcal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;backdrop-filter:blur(10px)}
.dwk,.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dwk span{text-align:center;font-size:12px;color:var(--soft);padding:2px 0 6px}
.dcell{position:relative;aspect-ratio:1/1.05;border:1px solid var(--line);background:none;border-radius:12px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0}
.dcell.empty{border:0}
.dcell:hover{border-color:#FF8FB1}
.dcell.has{background:linear-gradient(160deg,color-mix(in srgb,#FF8FB1 14%,transparent),transparent)}
.dcell.today{border:2px solid #FF8FB1}
.dcell.fut{opacity:.45}
.dn{font-weight:700;font-size:13px}
.dm{font-size:22px;line-height:1}
.dsk{width:60%;max-width:46px}.dsk svg{width:100%;height:auto;display:block}
.dl{font-size:11px;color:var(--soft);line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:780px){.dcell{padding:4px;border-radius:9px}.dl{display:none}.dm{font-size:18px}.dmstat{width:100%;margin:0}}
.dayhead{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.dpaperwrap{background:#FFFCF5;color:#2B2620;border-radius:18px;padding:18px 18px 22px;box-shadow:0 14px 40px rgba(0,0,0,.25);border:1px solid #EFE6D6}
.daytitle{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.dbig{font-family:"Caveat",cursive;font-size:64px;line-height:.9;color:#E0245E;font-weight:700}
.dsub{font-size:14px;color:#7A6F64;text-transform:capitalize}.dsub b{color:#2B2620;font-size:16px}
.moods{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.mood{border:1px solid #EFE6D6;background:#fff;border-radius:12px;font-size:22px;width:42px;height:42px;padding:0;transition:transform .1s}
.mood:hover{transform:scale(1.08)}.mood.on{background:#FFE1EA;border-color:#FF8FB1;transform:scale(1.1)}
.dline{width:100%;border:0;border-bottom:2px dashed #E9D9C3;background:none;font:26px/1.3 "Caveat","Segoe Print",cursive;color:#2B2620;padding:4px 2px;margin-bottom:10px;outline:none}
.dline::placeholder{color:#B8AC9C}
.dtools{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.dtbtn{border:1px solid #E9D9C3;background:#fff;border-radius:9px;padding:5px 10px;font-size:13px;color:#2B2620}
.dtbtn:hover{border-color:#FF8FB1}.dtbtn.danger{color:#B3261E}
.dpage{position:relative;min-height:62vh;border-radius:10px;background-color:#FFFDF8;background-image:linear-gradient(#EDE4D3 1px,transparent 1px),linear-gradient(90deg,#EDE4D3 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px;border:1px solid #EFE6D6;overflow:hidden}
.dtext{position:relative;min-height:62vh;padding:10px 14px;outline:none;font:23px/1.32 "Caveat","Segoe Print",cursive;color:#2B2620;white-space:pre-wrap;word-break:break-word}
.dtext:empty::before{content:attr(data-ph);color:#B8AC9C;pointer-events:none}
.dstk{position:absolute;inset:0;pointer-events:none}
.pst{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;transform-origin:50% 50%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.pst svg{width:100%;height:auto;display:block;pointer-events:none}
.pst.sel{outline:2px dashed #FF8FB1;outline-offset:4px}
.h-rs,.h-rot,.h-del{position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #FF8FB1;display:grid;place-items:center;font-size:14px;color:#2B2620;touch-action:none}
.h-rs{right:-14px;bottom:-14px;cursor:nwse-resize}.h-rot{left:50%;top:-34px;transform:translateX(-50%);cursor:grab}.h-del{right:-14px;top:-14px;padding:0;color:#B3261E;cursor:pointer;line-height:1}
@media (max-width:780px){.dhero-hide .hero{display:none}.dpaperwrap{padding:14px 12px 16px;border-radius:16px;margin:0 -4px}.dbig{font-size:54px}.mood{width:38px;height:38px;font-size:20px}}
/* рисовалка и библиотека */
.drawwrap{background:repeating-conic-gradient(#f3f3f3 0 25%,#fff 0 50%) 0 0/24px 24px;border-radius:14px;border:1px solid var(--line);max-width:520px;margin:0 auto 10px}
#dcanvas{width:100%;aspect-ratio:1;display:block;touch-action:none;cursor:crosshair}
.dpal{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.dcol{width:30px;height:30px;border-radius:50%;background:var(--c);border:2px solid var(--line);padding:0}
.dcol.on{outline:3px solid var(--acc);outline-offset:2px}
.dctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:6px}.dctl .seg{flex:0 0 auto}.dctl .btn{padding:8px 12px}
#deraser.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.stkhead{display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px;font-weight:600}
.stkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-bottom:12px}
.stkcell{position:relative}

function cleanNote(html){
  const tpl=document.createElement("template");tpl.innerHTML=html;
  const OK=new Set(["B","STRONG","U","S","STRIKE","DEL","SPAN","FONT","BR","DIV","P","I","EM"]);
  const walk=node=>{[...node.childNodes].forEach(ch=>{
    if(ch.nodeType===3)return;
    if(ch.nodeType!==1||!OK.has(ch.tagName)){if(ch.nodeType===1){walk(ch);ch.replaceWith(...ch.childNodes)}else ch.remove();return}
    walk(ch);
    let color=ch.getAttribute("color")||ch.style?.color||"";const st=ch.style;
    const fw=st?.fontWeight,td=st?.textDecorationLine||st?.textDecoration||"";
    [...ch.attributes].forEach(a=>ch.removeAttribute(a.name));
    let el=ch;
    if(ch.tagName==="FONT"){el=document.createElement("span");el.append(...ch.childNodes);ch.replaceWith(el)}

function lastDays(n){const out=[],d=new Date();d.setHours(12);for(let i=n-1;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);out.push(x)}return out}

const BM_ROOTS=new Set(["панель закладок","bookmarks bar","bookmarks toolbar","панель закладок firefox","другие закладки","other bookmarks","меню закладок","bookmarks menu","закладки на мобильном","mobile bookmarks","избранное","favorites","favorites bar","панель избранного","закладки","bookmarks"]);
function parseBookmarks(html){
  const doc=new DOMParser().parseFromString(html,"text/html");const out=[];
  const hdr=dl=>{const p=dl.previousElementSibling;if(p&&p.tagName==="H3")return p.textContent.trim();const dt=dl.parentElement;if(dt&&dt.tagName==="DT"){const h=dt.querySelector(":scope > h3");if(h)return h.textContent.trim()}return null};
  for(const a of doc.querySelectorAll("a[href]")){
    const url=a.getAttribute("href")||"";if(!/^https?:\/\//i.test(url))continue;
    const path=[];let el=a.parentElement;while(el){if(el.tagName==="DL"){const h=hdr(el);if(h)path.unshift(h)}el=el.parentElement}
    while(path.length&&BM_ROOTS.has(path[0].toLowerCase()))path.shift();
    out.push({path,title:a.textContent.trim(),url});
  }
  return out;
}

function sysMsg(){
  const z=state.sys,t=todayStr(),gap=z.lastVisit?Math.floor((Date.now()-z.lastVisit)/864e5):0;
  if(gap>=3)return ["⚠️ Возвращение",`Тебя не было ${gap} дн. Система скучала. Начнём с одного маленького задания — и серия снова пойдёт.`];
  const dd=dailyState();if(dd.all&&dd.done===dd.all)return ["✅ Задание дня выполнено","Награда получена. Можно отдыхать без чувства вины 🎮"];
  const h=new Date().getHours(),pool=h>=21?SYS_TONE.strict:Math.random()<.4?SYS_TONE.fun:Math.random()<.5?SYS_TONE.soft:SYS_TONE.strict;
  return ["Система",pool[Math.floor(Math.random()*pool.length)]];
}
function weekKeys(){const d=new Date();d.setHours(12);const wd=(d.getDay()+6)%7,out=[];for(let i=0;i<=wd;i++){const x=new Date(d);x.setDate(d.getDate()-i);out.push(dstr(x))}return out}
function qDoneToday(q){return !!q.done?.[todayStr()]}
function qAvailable(q){if(!q.active)return false;if(q.rep==="once")return !Object.keys(q.done||{}).length;if(q.rep?.startsWith("week")){const n=+q.rep.split(":")[1]||1;return weekKeys().filter(k=>q.done?.[k]).length<n||qDoneToday(q)}return true}
function weekProg(q){const n=+q.rep.split(":")[1]||1;return [weekKeys().filter(k=>q.done?.[k]).length,n]}
function pickDaily(){
  const z=state.sys,t=todayStr();if(z.daily.date===t&&z.daily.ids.every(id=>z.quests.some(q=>q.id===id))){const started=z.daily.ids.some(id=>z.quests.find(q=>q.id===id)?.done?.[t]);if(started||z.daily.ids.length>=Math.min(3,z.quests.filter(q=>q.active&&q.area!=="fun"&&qAvailable(q)).length))return}
  const av=z.quests.filter(q=>q.active&&qAvailable(q)&&q.area!=="fun");
  const by=a=>av.filter(q=>q.area===a),rnd=a=>a[Math.floor(Math.random()*a.length)];
  const ids=[];const add=q=>{if(q&&!ids.includes(q.id))ids.push(q.id)};
  add(rnd(by("body").filter(q=>(q.min||10)<=10).concat(by("body"))));add(rnd(by("lang").concat(by("brain"))));
  add(rnd(av.filter(q=>!ids.includes(q.id)&&(q.min||10)<=10)));
  while(ids.length<3&&av.length>ids.length)add(rnd(av));
  z.daily={date:t,ids,claimed:false};
}
function dailyState(){const z=state.sys;if(!z.daily||z.daily.date!==todayStr())return {all:0,done:0};const qs=z.daily.ids.map(id=>z.quests.find(q=>q.id===id)).filter(Boolean);return {all:qs.length,done:qs.filter(qDoneToday).length,qs}}
function dailyStreak(){const z=state.sys;let n=0;const d=new Date();d.setHours(12);if(!z.dailyDone[dstr(d)])d.setDate(d.getDate()-1);while(z.dailyDone[dstr(d)]){n++;d.setDate(d.getDate()-1)}return n}
function addXp(n,why,area){
  const z=state.sys,before=lvlInfo(z.xp).lvl;z.xp=Math.max(0,z.xp+n);if(area&&n>0)z.stats[area]=(z.stats[area]||0)+n;if(area&&n<0)z.stats[area]=Math.max(0,(z.stats[area]||0)+n);
  z.log.unshift({at:Date.now(),xp:n,why});z.log=z.log.slice(0,60);
  const after=lvlInfo(z.xp).lvl;if(after>before&&!z.awarded[`lvl:${after}`]){z.awarded[`lvl:${after}`]=1;setTimeout(()=>{rollLoot(1);change()},1500)}if(after>before)sysPopup(`🎉 Новый уровень: ${after}`,rankOf(after)[1]!==rankOf(before)[1]?`Ранг повышен до ${rankOf(after)[1]}! Так держать, охотница.`:"Ты стала сильнее.");
  checkAch();
}

function sysStats(){

}

function toggleQuest(id){
  const z=state.sys,q=z.quests.find(x=>x.id===id),t=todayStr();if(!q)return;q.done=q.done||{};

/* ---------- уведомления (push) ---------- */
const b64u=u8=>b64(u8).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const ub64u=s=>ub64(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4));
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function pushSupport(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){
    if(isIOS&&!isStandalone)return "ios-install";return "no"}
  if(location.protocol!=="https:")return "https";return "ok";
}
async function pushStatus(){try{if(pushSupport()!=="ok")return false;const r=await navigator.serviceWorker.getRegistration();const s=r&&await r.pushManager.getSubscription();return !!s&&Notification.permission==="granted"}catch{return false}}
const pushPath=()=>`/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/push.json`;
async function readPushFile(){const g=await gh(pushPath()+"?t="+Date.now());if(!g.ok)return {sha:null,data:{subs:[]}};const j=await g.json();let data={subs:[]};try{data=JSON.parse(dec.decode(ub64(j.content.replace(/\s/g,""))))}catch{}return {sha:j.sha,data}}
async function writePushFile(data,sha){const bytes=enc.encode(JSON.stringify(data,null,1));const r=await gh(pushPath(),{method:"PUT",body:JSON.stringify({message:"push",content:b64(bytes),...(sha?{sha}:{})})});if(!r.ok)throw new Error("GitHub "+r.status)}
async function enablePush(){
  const sup=pushSupport();
  if(sup==="ios-install"){toast("На iPhone сначала установи справочник на экран Домой: Поделиться → «На экран Домой», и открой его оттуда");return}
  if(sup==="https"){toast("Уведомления работают только на сайте (https), не из файла");return}
  if(sup!=="ok"){toast("Этот браузер не умеет уведомления. Попробуй Chrome или установленное приложение");return}
  const perm=await Notification.requestPermission();if(perm!=="granted"){toast("Уведомления запрещены. Разреши их в настройках браузера для этого сайта");return}
  try{
    toast("Подключаю уведомления…");
    const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;
    let {sha,data}=await readPushFile();data.subs=Array.isArray(data.subs)?data.subs:[];
    if(!data.vapidPublic||!data.vapidPrivate){
      const kp=await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);
      data.vapidPublic=b64u(new Uint8Array(await crypto.subtle.exportKey("raw",kp.publicKey)));
      data.vapidPrivate=(await crypto.subtle.exportKey("jwk",kp.privateKey)).d;
    }
    let sub=await reg.pushManager.getSubscription();
    if(sub){const k=sub.options?.applicationServerKey;if(k&&b64u(new Uint8Array(k))!==data.vapidPublic){await sub.unsubscribe();sub=null}}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:ub64u(data.vapidPublic)});
    const js=sub.toJSON();const dev=(isIOS?"iPhone":/Android/.test(navigator.userAgent)?"Android":"Компьютер")+" · "+new Date().toLocaleDateString("ru-RU");
    data.subs=data.subs.filter(x=>x.endpoint!==js.endpoint);data.subs.push({endpoint:js.endpoint,keys:js.keys,device:dev,at:Date.now()});
    await writePushFile(data,sha);
    try{localStorage.setItem("spr-push","1")}catch{}
    reg.showNotification("СИСТЕМА",{body:"Уведомления включены. Теперь я смогу напоминать о задании дня ⚔️",icon:"icon-192.png",badge:"icon-192.png",tag:"system"});
    toast("Уведомления включены на этом устройстве");render();
  }catch(e){toast("Не получилось включить уведомления: "+(e.message||e))}
}
async function disablePush(){
  try{const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){const ep=sub.endpoint;await sub.unsubscribe();const {sha,data}=await readPushFile();data.subs=(data.subs||[]).filter(x=>x.endpoint!==ep);await writePushFile(data,sha)}
    try{localStorage.removeItem("spr-push")}catch{}toast("Уведомления выключены на этом устройстве");render()}catch(e){toast("Не получилось: "+(e.message||e))}
}

function openDraw(){

  <div class="drawwrap"><canvas id="dcanvas" width="1000" height="1000"></canvas></div>

  <div class="dctl"><div class="seg" data-seg="dsize">${[["6","Тонко"],["14","Средне"],["30","Толсто"]].map(([v,l])=>`<button type="button" data-v="${v}" class="${v==="14"?"on":""}">${l}</button>`).join("")}</div>
  <button type="button" class="btn" data-act="deraser" id="deraser">Ластик</button><button type="button" class="btn" data-act="dundo">↶ Назад</button><button type="button" class="btn" data-act="dwipe">Очистить</button></div>

  const cv=$("#dcanvas");redrawCanvas();
  const pos=e=>{const r=cv.getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*1000),Math.round((e.clientY-r.top)/r.height*1000)]};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const [x,y]=pos(e);
    if(drawCtx.eraser){eraseAt(x,y);drawCtx.erasing=true;return}

    case "newnote":{const n={id:uid(),text:"",color:NOTE_COLORS[state.notes.length%NOTE_COLORS.length],at:Date.now()};state.notes.push(n);change();render();setTimeout(()=>document.querySelector(`.stext[data-note="${n.id}"]`)?.focus(),0);break}
    case "add":cur==="diary"?openDiaryDay(todayStr()):cur==="habits"?openHabit():cur==="vault"?openVaultItem():cur==="kb"?openDoc():cur==="tasks"?openTask(null,"todo"):cur==="journal"?openJournal():openItem();break;
    case "tsave":saveTask();break;
    case "tdel":if(confirm("Удалить задачу? Она попадёт в корзину.")){{const tt=state.tasks.find(x=>x.id===dlgCtx.t.id);if(tt)toTrash("task",tt,"Задачи",tt.title)}state.tasks=state.tasks.filter(x=>x.id!==dlgCtx.t.id);change();closeDlg();render()}break;
    case "tclear":{const n=state.tasks.filter(t=>t.col==="done"&&(taskProj==="all"||t.project===taskProj)).length;if(confirm(`Удалить готовые задачи (${n})? Они попадут в корзину.`)){state.tasks.filter(t=>t.col==="done"&&(taskProj==="all"||t.project===taskProj)).forEach(t=>toTrash("task",t,"Задачи",t.title));state.tasks=state.tasks.filter(t=>!(t.col==="done"&&(taskProj==="all"||t.project===taskProj)));change();render()}break}
    case "jsave":saveJournal();break;
    case "jdel":if(confirm("Удалить запись? Она попадёт в корзину.")){{const jj=state.journal.find(x=>x.id===dlgCtx.j.id);if(jj)toTrash("journal",jj,"Журнал изменений",(jj.text||"").split("\n")[0].slice(0,60))}state.journal=state.journal.filter(x=>x.id!==dlgCtx.j.id);change();closeDlg();render()}break;
    case "dsave":saveDoc();break;
    case "ddel":if(confirm("Удалить документ со всеми версиями? Он попадёт в корзину.")){{const dd=state.docs.find(x=>x.id===dlgCtx.doc.id);if(dd)toTrash("doc",dd,"База знаний",dd.title)}state.docs=state.docs.filter(x=>x.id!==dlgCtx.doc.id);change();closeDlg();render()}break;
    case "dcopytxt":copy($("#d-text").value);break;
    case "dupload":$("#txtFile").click();break;
    case "ddownload":{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("#d-text").value],{type:"text/plain;charset=utf-8"}));a.download=(($("#d-title").value.trim()||"document").replace(/[\\/:*?"<>|]/g,"_"))+".txt";document.body.appendChild(a);a.click();a.remove();break}
    case "drestore":{const c=dlgCtx,txt=c.doc.history[c.ver].text;c.draft=txt;showVer(-1);toast("Версия возвращена в редактор. Нажми «Сохранить»");break}
    case "close":if(dlgCtx?.kind==="doc"){const c=dlgCtx,t=c.ver===-1?$("#d-text").value:c.draft;if(t!==c.doc.text&&!confirm("Закрыть без сохранения? Изменения в тексте пропадут."))break}closeDlg();break;
    case "saveitem":{const{it,isNew}=dlgCtx,s=SEC[it.sec];const url=$("#f-url").value.trim();let name=$("#f-name").value.trim();
      if(!name&&!url){toast("Укажи ссылку или название");return}if(!name)name=autoName(url);
      const sv=k=>$(`[data-seg="${k}"] .on`)?.dataset.v;const n={...it,name,url,note:$("#f-note").value.trim()};
      const fsec=$("#f-sec");if(fsec&&fsec.value&&fsec.value!=="__newtab"&&fsec.value!==it.sec){n.sec=fsec.value;const fc=$("#f-cat");n.cat=SEC[n.sec]?.tab&&fc&&fc.value!=="__new"?fc.value:"";if(!SEC[n.sec]?.tab)delete n.cat;
        if(isNew){}else{state.items[state.items.findIndex(i=>i.id===it.id)]=n;change();closeDlg();render();toast("Перемещено в «"+SEC[n.sec].title+"»");return}}
      if(s.progress){const dn=$("#f-done").value,tt=$("#f-total").value;n.done=dn===""?"":Math.max(0,+dn);n.total=tt===""?"":Math.max(0,+tt);n.unit=$("#f-unit").value.trim()||"уроков"}
      if(s.speech)n.stype=sv("stype")||"asr";
      if(s.cats)n.cat=$("#f-cat")&&$("#f-cat").value!=="__new"?$("#f-cat").value:"";if(s.engines)n.engine=sv("engine")??"";if(s.env)n.env=sv("env")||"";if(s.status)n.status=sv("status");
      if(s.stack){n.gender=sv("gender")||"";for(const k of ["asr","tts","llm"])n[k]=[...document.querySelectorAll(`[data-multi="${k}"] .mopt.on`)].map(b=>b.dataset.mv)}
      if(isNew){n.id=uid();state.items.push(n)}else state.items[state.items.findIndex(i=>i.id===it.id)]=n;
      change();closeDlg();render();break}
    case "del":if(confirm("Удалить запись? Она попадёт в корзину.")){const delId=dlgCtx.it.id;const delIt=state.items.find(i=>i.id===delId);toTrash("item",delIt,trashFrom(delIt),delIt.name,delIt.sec==="projects"?{links:{docs:state.docs.filter(x=>x.projects.includes(delId)).map(x=>x.id),tasks:state.tasks.filter(x=>x.project===delId).map(x=>x.id),journal:state.journal.filter(x=>x.project===delId).map(x=>x.id)}}:null);state.docs.forEach(x=>x.projects=x.projects.filter(p=>p!==delId));state.tasks.forEach(x=>{if(x.project===delId)x.project=""});state.journal.forEach(x=>{if(x.project===delId)x.project=""});state.items=state.items.filter(i=>i.id!==delId);change();closeDlg();render()}break;
    case "vcreate":{const a=$("#mp1").value,b=$("#mp2").value;if(a.length<4){toast("Минимум 4 символа");return}if(a!==b){toast("Пароли не совпадают");return}await createVault(a);startVaultTimer();render();toast("Хранилище создано. Не забудь нажать «Сохранить»");break}
    case "vopen":try{await openVault($("#mp").value);startVaultTimer();render()}catch{toast("Неверный мастер-пароль")}break;
    case "vlock":lockVault();break;
    case "vextend":vaultUntil=Math.min(vaultUntil+60000,Date.now()+5*60000);vaultTick();toast("+1 минута");break;
    case "vsave":{const{v,isNew}=dlgCtx;const where=$("#v-where").value.trim();if(!where){toast("Укажи, где этот пароль");return}
      const n={...v,where,url:$("#v-url").value.trim(),login:$("#v-login").value,password:$("#v-pass").value,note:$("#v-note").value.trim()};
      if(isNew){n.id=uid();vaultItems.push(n)}else vaultItems[vaultItems.findIndex(x=>x.id===v.id)]=n;
      await sealVault();closeDlg();render();break}
    case "vdel":if(confirm("Удалить пароль?")){vaultItems=vaultItems.filter(x=>x.id!==dlgCtx.v.id);await sealVault();closeDlg();render()}break;
    case "import":$("#importFile").click();break;
    case "exportjson":{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:"application/json"}));a.download=`spravochnik-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();break}
  }
});
document.addEventListener("change",async e=>{const s=e.target;
  if(s.dataset?.qtoggle){const q=state.sys.quests.find(x=>x.id===s.dataset.qtoggle);if(q){q.active=s.checked;if(!q.active&&state.sys.daily?.ids?.includes(q.id)&&!qDoneToday(q))state.sys.daily={};change();render()}return}
  if(s.dataset?.bmf!==undefined){dlgCtx.folders[+s.dataset.bmf].on=s.checked;return}
  if(s.id==="bm-target"){if($("#bm-newname"))dlgCtx.newName=$("#bm-newname").value;dlgCtx.target=s.value;drawBm();return}
  if(s.id==="bmFile"){const f=s.files[0];s.value="";if(!f)return;try{const list=parseBookmarks(await f.text());if(!list.length){toast("В файле не нашлось закладок");return}openBmImport(list)}catch{toast("Не получилось прочитать файл закладок")}return}
  if(s.classList?.contains("selbox")){s.checked?selected.add(s.dataset.selid):selected.delete(s.dataset.selid);renderSelBar();return}
  if(s.id==="f-sec"||s.id==="sel-tgt"){
    let v=s.value;
    if(v==="__newtab"){const id=quickNewTab(prompt("Название новой вкладки:"));if(!id){s.value=s.id==="f-sec"?(dlgCtx?.it?.sec||""):($("#selbar")?.dataset.tgt||"");return}v=id;
      if(s.id==="f-sec"){s.innerHTML=secOptions(v,true);s.value=v;renderNav()}}
    if(s.id==="f-sec"){$("#f-catwrap").innerHTML=SEC[v]?.tab?catSelect(SEC[v].tab,""):""}
    else{$("#selbar").dataset.tgt=v;renderSelBar();renderNav()}
    return}
  if(s.id==="sel-cat"&&s.value==="__new"){const tab=SEC[s.dataset.catsel]?.tab;const id=tab&&addCategory(tab,prompt("Название новой категории:"));if(id){s.innerHTML=catOptions(tab.id,id);s.value=id}else s.value="";return}
  if(s.id==="f-cat"&&s.value==="__new"){const v=prompt("Название новой категории:");const tab=state.tabs.find(t=>t.id===s.dataset.catsel);const id=tab&&addCategory(tab,v);
    if(id){if(![...s.options].some(o=>o.value===id)){const o=document.createElement("option");o.value=id;o.textContent=v.trim();s.insertBefore(o,s.lastElementChild)}s.value=id}else s.value="";return}
  if(s.id==="pd-link"&&s.value){const doc=state.docs.find(x=>x.id===s.value);if(doc){doc.projects.push(dlgCtx.pid);change();openProjDocs(dlgCtx.pid);render();toast("Привязано")}return}
  if(s.id==="txtFile"){const f=s.files[0];if(f){const txt=await f.text();const ta=$("#d-text");if(ta&&!ta.readOnly){if(!ta.value||confirm("Заменить текст в редакторе содержимым файла?")){ta.value=txt;docInfo()}if(!$("#d-title").value.trim())$("#d-title").value=f.name.replace(/\.[^.]+$/,"")}}s.value="";return}if(s.dataset?.stack&&s.value==="__new"){const k=s.dataset.stack,v=(prompt(`Новый ${k.toUpperCase()}:`)||"").trim();
  if(v){if(!state.lists[k].includes(v)){state.lists[k].push(v);change()}const o=document.createElement("option");o.textContent=v;s.insertBefore(o,s.lastElementChild);s.value=v}else s.value=""}});
document.addEventListener("input",e=>{if(e.target.id==="q"){query=e.target.value.trim();render();return}
  if(e.target.id==="d-text"){docInfo();return}
  const ce=e.target.closest?.(".stext");if(ce){noteSync(ce);return}
  const de=e.target.closest?.(".dtext");if(de){syncDay(de);return}
  if(e.target.id==="d-line"){const o=dayObj(dDay,true);o.line=e.target.value;o.at=Date.now();change();return}
  const nid=e.target.dataset?.note;if(nid){const n=state.notes.find(x=>x.id===nid);if(n){n.text=e.target.value;n.at=Date.now();change()}}});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"||(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="ы"){e.preventDefault();if(dlgCtx?.kind==="doc"){saveDoc()}saveFile();return}
  if(e.key==="Tab"&&e.target.id==="d-text"&&!e.target.readOnly){e.preventDefault();const t=e.target,a=t.selectionStart;t.setRangeText("  ",a,t.selectionEnd,"end");docInfo();return}
  if(e.key==="Enter"){const id=e.target.id;
    if(id==="m"){e.preventDefault();unlock();return}if(id==="m2"){e.preventDefault();createNew();return}if(id==="g-path"||id==="g-token"||id==="g-repo"){e.preventDefault();connect();return}if(id==="g-newtoken"){e.preventDefault();newToken();return}if(id==="mnew"){e.preventDefault();unlockNewPass();return}if(id==="cp-new2"){e.preventDefault();changePass();return}if(id==="vp-new2"){e.preventDefault();changeVaultPass();return}
    if(id==="mp"){e.preventDefault();$('[data-act="vopen"]').click()}
    if(id==="mp2"){e.preventDefault();$('[data-act="vcreate"]').click()}
    if(id==="tb-newcat"){e.preventDefault();$('[data-act="tbaddcat"]').click();return}
    if(id?.startsWith("ladd-")){e.preventDefault();$(`[data-ladd="${id.slice(5)}"]`).click()}
    if(e.target.dataset?.maddin){e.preventDefault();document.querySelector(`[data-madd="${e.target.dataset.maddin}"]`).click();return}
    if(dlgCtx?.kind==="task"&&e.target.id==="t-title"){e.preventDefault();saveTask();return}
    if(dlgCtx&&(dlgCtx.kind==="item"||dlgCtx.kind==="vault")&&e.target.tagName==="INPUT"){e.preventDefault();$(dlgCtx.kind==="vault"?'[data-act="vsave"]':'[data-act="saveitem"]').click()}}
  if(e.key==="Escape"&&document.body.classList.contains("navopen")){document.body.classList.remove("navopen");return}
  if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}
  if(e.key==="Escape"&&document.activeElement.id==="q"&&query){query="";render()}
});
$("#dlg").addEventListener("close",()=>{dlgCtx=null});
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
$("#importFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;
  try{let txt=await f.text();if(/<html/i.test(txt)){const m=txt.match(/<script id="appdata" type="application\/json">([\s\S]*?)<\/script>/);txt=m?m[1]:"null"}
    {const j=JSON.parse(txt);if(j&&j.ct&&!j.items)throw 0}
    const s=normalize(JSON.parse(txt));if(!s.items.length&&!s.vault)throw 0;
    if(!confirm(`Заменить текущие данные? В копии записей: ${s.items.length}.`))return;
    state=s;vaultKey=null;vaultItems=null;change();render();toast("Загружено. Нажми «Сохранить»");
  }catch{toast("Файл не похож на копию справочника")}e.target.value=""});

addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;try{if(state&&!document.body.classList.contains("gated"))renderNav()}catch{}});
