<title>Coding girl</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='h' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23FF5C7A'/%3E%3Cstop offset='1' stop-color='%23D3163F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 57S5 41 5 22a14 14 0 0 1 27-5 14 14 0 0 1 27 5c0 19-27 35-27 35Z' fill='url(%23h)'/%3E%3Cellipse cx='18' cy='20' rx='5' ry='3.5' fill='%23fff' opacity='.45' transform='rotate(-35 18 20)'/%3E%3C/svg%3E">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Caveat:wght@500;600&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080B18;--bgimg:radial-gradient(900px 600px at 8% -5%,rgba(120,110,255,.22),transparent 60%),radial-gradient(700px 500px at 100% 0%,rgba(46,242,255,.16),transparent 60%),radial-gradient(800px 600px at 75% 110%,rgba(46,242,255,.10),transparent 60%);
  --panel:rgba(17,16,40,.78);--panel2:rgba(28,26,62,.9);--ink:#ECE9FF;--soft:#9A96C4;--line:rgba(139,120,255,.24);--hover:rgba(139,120,255,.10);
  --acc:#2EF2FF;--acc2:#9D6BFF;--amb:#FFC43D;--prod:#3DFF8E;--test:#FFA62B;--danger:#FF5C7A;--on-acc:#04121A;
  --dlg:#0E0D22;--grid-op:1;--hero-base:#0B1024;--hero-ink:#fff;--bldg:#070A16;--glow:1;
  --hfont:"Unbounded","Golos Text",system-ui,sans-serif;--save:linear-gradient(135deg,#2EF2FF,#7B8CFF);
}
:root[data-theme="light"]{
  --bg:#EEF1F4;--bgimg:linear-gradient(transparent,transparent);--panel:#FFFFFF;--panel2:#F7F9FB;--ink:#18202C;--soft:#5D6878;--line:#DDE2E8;--hover:#F2F5F8;
  --acc:#1F6FD1;--acc2:#5B4BD6;--amb:#B7791F;--prod:#1F8A4C;--test:#C27A0E;--danger:#B3261E;--on-acc:#fff;
  --dlg:#fff;--grid-op:0;--hero-base:#FFFFFF;--hero-ink:#18202C;--bldg:#C9D3DF;--glow:0;
  --hfont:"Golos Text",system-ui,sans-serif;--save:#18202C;
}
:root[data-theme="lavender"]{
  --bg:#F4F0FB;--bgimg:radial-gradient(800px 500px at 0% 0%,rgba(190,160,255,.35),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(255,180,220,.30),transparent 60%);
  --panel:rgba(255,255,255,.85);--panel2:#fff;--ink:#2A2140;--soft:#6F6590;--line:#E4DAF5;--hover:#F6F1FF;
  --acc:#7C5CFF;--acc2:#D0479B;--amb:#C07A12;--prod:#22975A;--test:#D2811A;--danger:#C6284F;--on-acc:#fff;
  --dlg:#fff;--grid-op:0;--hero-base:#FFFFFF;--hero-ink:#2A2140;--bldg:#D9CCF5;--glow:0;
  --hfont:"Unbounded","Golos Text",system-ui,sans-serif;--save:linear-gradient(135deg,#7C5CFF,#D0479B);
}
:root[data-theme="forest"]{
  --bg:#0D1613;--bgimg:radial-gradient(900px 600px at 0% 0%,rgba(80,200,150,.14),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(200,220,120,.08),transparent 60%);
  --panel:rgba(20,33,28,.85);--panel2:#1B2C25;--ink:#E3F1EA;--soft:#93AFA2;--line:rgba(120,200,160,.18);--hover:rgba(120,200,160,.08);
  --acc:#5FD3A0;--acc2:#B9D86A;--amb:#E8C15A;--prod:#6BE39A;--test:#F0A85A;--danger:#FF7B7B;--on-acc:#07140F;
  --dlg:#14211C;--grid-op:0;--hero-base:#11201A;--hero-ink:#F0FAF4;--bldg:#0A1410;--glow:.5;
  --hfont:"Golos Text",system-ui,sans-serif;--save:linear-gradient(135deg,#5FD3A0,#B9D86A);
}
:root[data-theme="sunset"]{
  --bg:#1A0F14;--bgimg:radial-gradient(900px 600px at 100% 0%,rgba(255,120,80,.22),transparent 60%),radial-gradient(800px 600px at 0% 100%,rgba(255,80,140,.14),transparent 60%);
  --panel:rgba(38,22,28,.85);--panel2:#2E1B22;--ink:#FBEDE6;--soft:#C9A79E;--line:rgba(255,150,120,.2);--hover:rgba(255,150,120,.08);
  --acc:#FF8A5B;--acc2:#FF5C9A;--amb:#FFC15E;--prod:#7BE29B;--test:#FFC15E;--danger:#FF6B6B;--on-acc:#1A0F14;
  --dlg:#24151B;--grid-op:0;--hero-base:#22131A;--hero-ink:#fff;--bldg:#13090D;--glow:.6;
  --hfont:"Unbounded","Golos Text",system-ui,sans-serif;--save:linear-gradient(135deg,#FF8A5B,#FF5C9A);
}
:root[data-theme="graphite"]{
  --bg:#121212;--bgimg:linear-gradient(transparent,transparent);--panel:#1B1B1B;--panel2:#222;--ink:#EDEDED;--soft:#9A9A9A;--line:#2C2C2C;--hover:#232323;
  --acc:#EDEDED;--acc2:#A8A8A8;--amb:#D4B76A;--prod:#8BD49B;--test:#E0A860;--danger:#F08080;--on-acc:#121212;
  --dlg:#1B1B1B;--grid-op:0;--hero-base:#1B1B1B;--hero-ink:#fff;--bldg:#0E0E0E;--glow:0;
  --hfont:"Golos Text",system-ui,sans-serif;--save:#EDEDED;
}
:root[data-theme="sakura"]{
  --bg:#FFF4F7;--bgimg:radial-gradient(800px 500px at 100% 0%,rgba(255,150,190,.30),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(190,140,255,.20),transparent 60%);
  --panel:rgba(255,255,255,.88);--panel2:#fff;--ink:#3A1F2E;--soft:#8C6478;--line:#F6D5E2;--hover:#FFEEF4;
  --acc:#F0508A;--acc2:#9B5CF0;--amb:#D9822B;--prod:#2E9E62;--test:#E0862A;--danger:#D12B4F;--on-acc:#fff;
  --dlg:#fff;--grid-op:0;--hero-base:#FFFFFF;--hero-ink:#3A1F2E;--bldg:#F8CFDE;--glow:0;
  --hfont:"Unbounded","Golos Text",system-ui,sans-serif;--save:linear-gradient(135deg,#F0508A,#9B5CF0);
}
:root[data-theme="matrix"]{
  --bg:#050A07;--bgimg:radial-gradient(900px 600px at 50% -10%,rgba(0,255,140,.12),transparent 60%);
  --panel:rgba(8,20,13,.85);--panel2:#0C1F14;--ink:#D6FFE8;--soft:#6FAF8C;--line:rgba(0,255,140,.18);--hover:rgba(0,255,140,.07);
  --acc:#00FF9C;--acc2:#4DD0FF;--amb:#E6FF5C;--prod:#00FF9C;--test:#FFC94D;--danger:#FF5C7A;--on-acc:#03140B;
  --dlg:#07130C;--grid-op:.5;--hero-base:#06120B;--hero-ink:#E8FFF2;--bldg:#020604;--glow:1;
  --hfont:"Unbounded","Golos Text",system-ui,sans-serif;--save:linear-gradient(135deg,#00FF9C,#4DD0FF);
}
:root{--e4:var(--acc);--e3:var(--acc2);--e2:var(--amb);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font:15px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bgimg),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:auto -20% 0 -20%;height:55vh;pointer-events:none;z-index:0;opacity:var(--grid-op);
  background:linear-gradient(transparent 0 calc(100% - 1px),rgba(46,242,255,.22) 0) 0 0/100% 46px,linear-gradient(90deg,transparent 0 calc(100% - 1px),rgba(157,107,255,.22) 0) 0 0/46px 100%;
  transform:perspective(420px) rotateX(62deg);transform-origin:bottom;mask-image:linear-gradient(to top,#000 10%,transparent 85%);-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{position:relative;z-index:1;display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;height:100vh;overflow:auto;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-family:var(--hfont);font-weight:600;font-size:14px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;color:var(--soft);position:relative}
.navbtn svg{flex:none;opacity:.85}.navbtn span{flex:1}.navbtn small{font-size:12px;color:var(--soft)}
.navbtn:hover{background:var(--hover);color:var(--ink)}
.navbtn.on{color:var(--ink);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.navbtn.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 calc(10px*var(--glow)) var(--acc)}
.navbtn.on svg{color:var(--acc);opacity:1}
.navsep{height:1px;background:var(--line);margin:10px 8px}
.navfoot{padding:12px 10px 0;display:flex;flex-direction:column;gap:6px}
.navfoot button{border:0;background:none;color:var(--soft);text-align:left;padding:2px 0;font-size:13px}
.navfoot button:hover{color:var(--acc)}
main{padding:22px clamp(14px,3vw,40px) 80px;max-width:1080px;width:100%}
.top{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);backdrop-filter:blur(8px)}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent);outline:none}
.search svg{position:absolute;z-index:1;pointer-events:none;left:13px;top:50%;transform:translateY(-50%);color:var(--acc)}
.btn{border:1px solid var(--line);background:var(--panel);padding:10px 15px;border-radius:10px;font-weight:600;white-space:nowrap;backdrop-filter:blur(8px)}
.btn:hover{border-color:var(--acc2);background:var(--panel2)}
.btn.add{border-color:color-mix(in srgb,var(--acc) 60%,transparent);color:var(--acc)}
.btn.save{background:var(--save);border:0;color:var(--on-acc)}
.btn.save.clean{background:var(--panel);color:var(--soft);border:1px solid var(--line)}
.btn.save .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-left:8px;vertical-align:middle}
.btn.save.clean .dot{display:none}
.btn.danger{color:var(--danger)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.icon{padding:10px 12px}
.savehint{font-size:12px;color:var(--soft);min-height:18px;margin:0 0 6px;text-align:right}
.savehint.dirty{color:var(--acc)}
.hero{position:relative;overflow:hidden;border-radius:18px;margin:6px 0 18px;min-height:150px;display:flex;align-items:flex-end;
  background:linear-gradient(160deg,color-mix(in srgb,var(--a) 30%,var(--hero-base)) 0%,var(--hero-base) 72%);border:1px solid color-mix(in srgb,var(--a) 35%,transparent)}
.hero.plain{min-height:0;background:none;border:0;border-radius:0}
.scene{position:absolute;inset:0;pointer-events:none}
.scene svg{position:absolute;right:0;bottom:0;width:100%;height:100%}
.scene .bl{fill:var(--bldg)}
.hero-in{position:relative;display:flex;align-items:center;gap:16px;padding:22px 24px}
.hero.plain .hero-in{padding:0}
.htile{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,var(--a),color-mix(in srgb,var(--a) 45%,#3B2BFF));box-shadow:0 8px 26px color-mix(in srgb,var(--a) 40%,transparent)}
h1{font-family:var(--hfont);font-weight:600;font-size:clamp(22px,3.4vw,32px);line-height:1.1;margin:0 0 6px;color:var(--hero-ink)}
.sub{color:color-mix(in srgb,var(--hero-ink) 75%,transparent);margin:0;font-size:14px;max-width:42ch}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters .gap{width:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--soft)}
.chip:hover{color:var(--ink)}
.chip.on{color:var(--on-acc);background:var(--acc);border-color:var(--acc)}
.chip[data-eng="3"].on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.chip[data-eng="2"].on{background:var(--amb);border-color:var(--amb);color:#fff}
.group{margin:24px 0 8px;font-family:var(--hfont);font-size:12.5px;display:flex;align-items:center;gap:10px;color:var(--soft)}
.group::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.group .cnt{color:var(--acc)}
.list{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);position:relative}
.row:first-child{border-top:0}
.row:hover{background:var(--hover)}
.row:hover::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--acc)}
.tag{width:34px;height:34px;display:grid;place-items:center;font-family:var(--hfont);font-weight:600;font-size:14px;flex:none;border-radius:10px}
.t4{background:color-mix(in srgb,var(--e4) 16%,transparent);color:var(--e4)}
.t3{background:color-mix(in srgb,var(--e3) 18%,transparent);color:var(--e3)}
.t2{background:color-mix(in srgb,var(--e2) 18%,transparent);color:var(--e2)}
.t0{background:var(--hover);color:var(--soft)}
.name{font-weight:600;text-decoration:none;word-break:break-word;font-size:15.5px;color:var(--ink)}
a.name:hover{color:var(--acc)}
.meta{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin-top:2px;align-items:center}
.dom{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.env{font-weight:700;font-size:12px;padding:1px 8px;border-radius:999px}.env.prod{color:var(--prod);background:color-mix(in srgb,var(--prod) 15%,transparent)}.env.test{color:var(--test);background:color-mix(in srgb,var(--test) 15%,transparent)}
.chip[data-envf="prod"].on{background:var(--prod);border-color:var(--prod);color:#fff}.chip[data-envf="test"].on{background:var(--test);border-color:var(--test);color:#fff}
.gen{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px}
.gen.m{background:color-mix(in srgb,#4C8DFF 18%,transparent);color:#4C8DFF}
.gen.f{background:color-mix(in srgb,#FF5FA2 18%,transparent);color:#FF5FA2}
.stack{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pill{font-size:12px;border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:6px;padding:1px 8px}
.pill b{font-weight:700;color:var(--acc);margin-right:5px}
.pill.empty{opacity:.4;border-color:var(--line);background:none}.pill.empty b{color:var(--soft)}
.old .name{color:var(--soft);text-decoration:line-through}
.acts{display:flex;gap:2px}
.ib{border:0;background:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--soft)}
.ib:hover{background:var(--hover);color:var(--acc)}
.ib.star.on{color:#FFB020}.ib.star.on svg{fill:#FFB020}
.ib.pin.on{color:var(--acc)}.ib.pin.on svg{fill:color-mix(in srgb,var(--acc) 40%,transparent)}
.ib.star:not(.on),.ib.pin:not(.on){opacity:.45}.row:hover .ib.star,.row:hover .ib.pin{opacity:1}
.row.pinned{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.mark{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--acc)}
.sticky.pinned::before{width:16px;height:16px;border-radius:50%;top:-6px;background:radial-gradient(circle at 35% 35%,#FF8A8A,#D3263A);box-shadow:0 2px 3px rgba(0,0,0,.35);transform:translateX(-50%)}
.spin{border:0;background:none;color:rgba(43,38,32,.55);font-size:13px;padding:0}
.spin:hover,.spin.on{color:#D3263A}
@media (hover:none){.ib.star:not(.on),.ib.pin:not(.on){opacity:.7}}
.empty-state{padding:34px 20px;text-align:center;color:var(--soft);background:var(--panel);border:1px dashed var(--line);border-radius:14px}
.empty-state svg{color:var(--acc2);opacity:.7;margin-bottom:8px}
.empty-state .btn{margin-top:12px}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--dlg);color:var(--ink);width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(4,3,10,.55);backdrop-filter:blur(3px)}
.dlg{padding:22px;max-height:88vh;overflow:auto}
.dlg h2{margin:0 0 16px;font-family:var(--hfont);font-weight:600;font-size:17px;color:var(--ink)}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px;color:var(--soft)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--ink);font-size:15px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--acc);outline:none}
.f textarea{min-height:62px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.dlgfoot{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.dlgfoot .r{display:flex;gap:8px;margin-left:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:8px;font-size:14px;color:var(--soft)}
.seg button.on{background:var(--acc);color:var(--on-acc);font-weight:600}
.multi{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.multi .mh{font-size:13px;color:var(--soft);margin-bottom:7px;display:flex;justify-content:space-between}
.multi .mh b{color:var(--acc);font-weight:700}
.mopts{display:flex;flex-wrap:wrap;gap:6px}
.mopt{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink)}
.mopt.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.mopt.on::before{content:"✓ "}
.madd{display:flex;gap:6px;margin-top:8px}
.madd input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:none;font-size:13px}
.madd button{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;font-size:13px}
.lists{display:grid;gap:18px}
.lists h3{margin:0 0 8px;font-family:var(--hfont);font-weight:600;font-size:14px;color:var(--acc)}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchip{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 4px 4px 10px;font-size:14px}
.lchip button{border:0;background:none;color:var(--soft);width:22px;height:22px;border-radius:5px}
.lchip button:hover{color:var(--danger)}
.addl{display:flex;gap:6px;margin-top:8px;max-width:440px}
.addl input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.lock{max-width:400px;margin:20px 0;background:var(--panel);border:1px solid var(--line);padding:24px;border-radius:14px}
.lock h2{margin:0 0 6px;font-family:var(--hfont);font-weight:600;font-size:17px}
.lock p{color:var(--soft);font-size:14px;margin:0 0 14px}
.pw{font-family:ui-monospace,Consolas,monospace;font-size:14px;letter-spacing:.05em;color:var(--amb)}
/* вход */
.gated nav,.gated .mobilefoot{display:none}.gated .app{grid-template-columns:1fr}.gated main{margin:0 auto}
.gate{max-width:460px;margin:7vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;backdrop-filter:blur(10px)}
.gate h2{margin:0 0 6px;font-family:var(--hfont);font-weight:600;font-size:20px}
.gate p{color:var(--soft);font-size:14px;margin:0 0 16px}
.gate .btn{width:100%;margin-top:4px}
.gate .err{color:var(--danger);font-size:14px;min-height:20px;margin:6px 0 0}
.gate .small{font-size:12.5px;color:var(--soft);margin-top:14px;line-height:1.5}
.gate .lnk{border:0;background:none;color:var(--acc);padding:0;font-size:13px;margin-top:12px}

  .brand,.navsep,.navfoot{display:none}

<body>
<div class="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>
<input type="file" id="txtFile" accept=".txt,.md,.json,.csv,text/*" hidden>
<input type="file" id="importFile" accept=".json,.html,application/json,text/html" hidden>
<div class="toast" id="toast"></div>
<script>
try{document.documentElement.dataset.theme=localStorage.getItem("spravochnik-theme")||"neon"}catch{}

/* ---------- разделы ---------- */
const IC = {
  sites:'<path d="M3 5h18v12H3z"/><path d="M8 21h8M12 17v4"/>',
  projects:'<path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/>',
  scripts:'<path d="m8 9-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"/>',
  sheets:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M4 9h16M4 15h16M10 3v18"/>',
  asr:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>',
  tts:'<path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/>',
  learn:'<path d="M2 8l10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3 3 9 3 12 0v-5"/>',
  apps:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
  refs:'<path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4Z"/><path d="M4 17a3 3 0 0 1 3-3h11"/>',
  games:'<path d="M6 8h12a4 4 0 0 1 4 4v1a4 4 0 0 1-7 2.6L14 15h-4l-1 .6A4 4 0 0 1 2 13v-1a4 4 0 0 1 4-4Z"/><path d="M8 11v3M6.5 12.5h3M16 12h.01M18 13.5h.01"/>',
  vault:'<rect x="4" y="10" width="16" height="11" rx="1"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',
  notes:'<path d="M5 3h14v12l-6 6H5z"/><path d="M13 21v-6h6"/>',
  palette:'<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.5-.8 1.2-1.6-.4-1 .2-2.4 1.6-2.4H17a4 4 0 0 0 4-4c0-5-4-10-9-10Z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',
  fav:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/>',
  pin:'<path d="M9 3h6l-1 6 4 4H6l4-4-1-6Z"/><path d="M12 13v8"/>',
  heart:'<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11Z"/>',
  kb:'<path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2Z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8Z"/>',
  lists:'<path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.5"/><circle cx="4" cy="12" r="1.5"/><circle cx="4" cy="18" r="1.5"/>',
};
const ico=(id,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[id]}</svg>`;
const SECTIONS = [
  {id:"fav",title:"Избранное",sub:"Всё, что отмечено звёздочкой, из всех разделов."},
  "sep",
  {id:"sites",title:"Сайты движков",sub:"Админки и сайты движков 4, 3 и 2.",engines:["4","3","2"],env:"opt",status:true,groupBy:"engine"},
  {id:"projects",title:"Проекты",sub:"Проекты движков 4 и 3: прод и тест, какие ASR, TTS и LLM подключены.",engines:["4","3"],env:true,stack:true,groupBy:"projenv"},
  {id:"scripts",title:"Скрипты",sub:"Скрипты и ссылки на них.",engines:["","4","3","2"],env:"opt",groupBy:"engine"},
  {id:"sheets",title:"Google-таблицы",sub:"Таблицы движков и общие.",engines:["","4","3","2"],env:"opt",groupBy:"engine"},
  "sep",
  {id:"notes",title:"Заметки",sub:"Быстрые записки для себя. Пиши прямо на стикере."},
  {id:"asr",title:"ASR",sub:"Распознавание речи: сервисы, демо, документация."},
  {id:"tts",title:"TTS",sub:"Синтез речи: сервисы, голоса, документация."},
  {id:"learn",title:"Обучалки",sub:"Курсы, гайды, видео."},
  {id:"apps",title:"Приложения",sub:"Программы и где их взять."},
  {id:"refs",title:"Справочники",sub:"Справочная информация."},
  {id:"games",title:"Игры",sub:"Для себя."},
  {id:"kb",title:"База знаний",sub:"Промпты и большие тексты. Хранятся версии, можно привязать к проектам."},
  "sep",
  {id:"vault",title:"Пароли",sub:"Зашифрованы мастер-паролем. Без него их не прочитать, даже открыв файл."},
  {id:"lists",title:"Списки ASR / TTS / LLM",sub:"Варианты, которые выбираются в проектах."},
];
const THEMES=[
 {id:"neon",name:"Неон",pv:["#080B18","#2EF2FF","#9D6BFF","#FFC43D"]},
 {id:"light",name:"Светлая",pv:["#EEF1F4","#1F6FD1","#5B4BD6","#18202C"]},
 {id:"lavender",name:"Лаванда",pv:["#F4F0FB","#7C5CFF","#D0479B","#FFC2D6"]},
 {id:"forest",name:"Лес",pv:["#0D1613","#5FD3A0","#B9D86A","#E8C15A"]},
 {id:"sunset",name:"Закат",pv:["#1A0F14","#FF8A5B","#FF5C9A","#FFC15E"]},
 {id:"graphite",name:"Графит",pv:["#121212","#EDEDED","#A8A8A8","#D4B76A"]},
 {id:"sakura",name:"Сакура",pv:["#FFF4F7","#F0508A","#9B5CF0","#F8CFDE"]},
 {id:"matrix",name:"Матрица",pv:["#050A07","#00FF9C","#4DD0FF","#E6FF5C"]},
];
const NOTE_COLORS=["yellow","pink","mint","blue","lilac","peach"];
const NOTE_HEX={yellow:"#FFE98A",pink:"#FFC2D6",mint:"#BDF2D5",blue:"#BFE0FF",lilac:"#DCCBFF",peach:"#FFD3AE"};
const SEC=Object.fromEntries(SECTIONS.filter(s=>s!=="sep").map(s=>[s.id,s]));
const ENG_LABEL={"":"Общие","4":"Движок 4","3":"Движок 3","2":"Движок 2"};

/* ---------- состояние ---------- */
let state, cur="sites", query="", engFilter="all", genFilter="all", envFilter="all";
let vaultKey=null, vaultItems=null, shown=new Set(), dirty=false, fileHandle=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2000)}
function domainOf(u){try{const x=new URL(u);return (x.hostname.replace(/^www\./,"")+(x.pathname.length>1?x.pathname:"")).replace(/\/$/,"")}catch{return u||""}}
function safeUrl(u){u=(u||"").trim();if(!u)return "";if(!/^[a-z]+:\/\//i.test(u))u="https://"+u;return /^https?:\/\//i.test(u)?u:""}
function autoName(u){try{const x=new URL(safeUrl(u));if(x.hostname.includes("docs.google.com"))return "Google-таблица";return x.hostname.replace(/^www\./,"")}catch{return ""}}
const arr=v=>Array.isArray(v)?v.filter(Boolean):(v?[v]:[]);
function normalize(s){s=s&&typeof s==="object"?s:{};
  const items=(Array.isArray(s.items)?s.items:[]).map(i=>i.sec==="projects"?{...i,asr:arr(i.asr),tts:arr(i.tts),llm:arr(i.llm)}:i);
  return {v:2,at:s.at||0,theme:s.theme||"neon",items,notes:Array.isArray(s.notes)?s.notes:[],docs:Array.isArray(s.docs)?s.docs.map(d=>({...d,projects:arr(d.projects),history:Array.isArray(d.history)?d.history:[]})):[],lists:{asr:s.lists?.asr||[],tts:s.lists?.tts||[],llm:s.lists?.llm||[]},vault:s.vault||null}}
function applyTheme(){if(!state)return;document.documentElement.dataset.theme=state.theme||"neon";try{localStorage.setItem("spravochnik-theme",state.theme)}catch{}}

/* ---------- GitHub ---------- */
const CFG_KEY="spr-gh-cfg",DRAFT_KEY="spr-gh-draft";
let cfg=null,dataKey=null,dataSalt=null,remoteSha=null,saving=false,draftTimer=null;
function loadCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||"null")}catch{return null}}
function parseRepo(v){v=(v||"").trim().replace(/^https?:\/\/(www\.)?github\.com\//,"").replace(/\.git$/,"").replace(/\/+$/,"");const p=v.split("/");return p.length>=2&&p[0]&&p[1]?{owner:p[0],repo:p[1]}:null}
async function gh(path,opt={}){
  return fetch("https://api.github.com"+path,{cache:"no-store",...opt,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+TOKEN,"X-GitHub-Api-Version":"2022-11-28",...(opt.headers||{})}});
}
const filePath=()=>`/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${(cfg.path||"data.enc.json").split("/").map(encodeURIComponent).join("/")}`;
async function fetchRemote(){
  const r=await gh(filePath()+"?t="+Date.now());
  if(r.status===404)return null;
  if(r.status===401)throw new Error("Токен не подходит. Проверь его в настройках GitHub");
  if(!r.ok)throw new Error("GitHub ответил ошибкой "+r.status);
  const j=await r.json();remoteSha=j.sha;
  let txt;
  if(j.content)txt=atob(j.content.replace(/\s/g,""));
  else{const r2=await gh(filePath(),{headers:{"Accept":"application/vnd.github.raw"}});txt=await r2.text()}
  return JSON.parse(txt);
}
async function encryptState(){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},dataKey,enc.encode(JSON.stringify(state)));
  return {app:"spravochnik",v:1,salt:dataSalt,iv:b64(iv),ct:b64(ct),at:state.at||0};
}
async function decryptBlob(blob,key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(blob.iv)},key,ub64(blob.ct));
  return normalize(JSON.parse(dec.decode(pt)));
}
function change(){dirty=true;state.at=Date.now();updateSaveUI();
  clearTimeout(draftTimer);draftTimer=setTimeout(async()=>{try{localStorage.setItem(DRAFT_KEY,JSON.stringify(await encryptState()))}catch{}},400)}
function updateSaveUI(){
  const b=$("#saveBtn"),h=$("#savehint");if(!b)return;
  b.classList.toggle("clean",!dirty);
  h.textContent=saving?"Сохраняю на GitHub…":dirty?"Есть несохранённые изменения. Ctrl+S или кнопка «Сохранить»":"Все изменения сохранены на GitHub";
  h.classList.toggle("dirty",dirty);
}
async function saveFile(force){
  if(saving||!dataKey)return;
  saving=true;updateSaveUI();
  try{
    const blob=await encryptState();
    const body={message:"Обновление "+new Date().toLocaleString("ru-RU"),content:btoa(JSON.stringify(blob))};
    if(remoteSha)body.sha=remoteSha;
    let r=await gh(filePath(),{method:"PUT",body:JSON.stringify(body)});
    if((r.status===409||r.status===422)&&!force){saving=false;updateSaveUI();conflict();return}
    if((r.status===409||r.status===422)&&force){
      const g=await gh(filePath()+"?t="+Date.now());if(g.ok){body.sha=(await g.json()).sha;r=await gh(filePath(),{method:"PUT",body:JSON.stringify(body)})}
    }
    if(r.status===401)throw new Error("Токен не подходит");
    if(r.status===403||r.status===404)throw new Error("У токена нет права записи в репозиторий");
    if(!r.ok)throw new Error("Ошибка "+r.status);
    remoteSha=(await r.json()).content.sha;
    dirty=false;try{localStorage.removeItem(DRAFT_KEY)}catch{}
    toast("Сохранено на GitHub");
  }catch(e){toast("Не сохранилось: "+(e.message||"нет связи")+". Данные остались в браузере, попробуй ещё раз")}
  saving=false;updateSaveUI();
}
function conflict(){
  showDlg(`<h2>Файл изменили на другом устройстве</h2><p style="color:var(--soft);font-size:14px;margin:0 0 14px">С тех пор как ты открыла справочник, на GitHub сохранили другую версию. Что сделать?</p>
  <div class="dlgfoot"><button class="btn" data-act="takeremote">Загрузить ту версию</button><div class="r"><button class="btn primary" data-act="forcesave">Сохранить мою поверх</button></div></div>`,{kind:"conflict"});

async function finishUnlock(key){
  // key: ключ, выведенный из пароля и соли cfg (или null). Загружаем и расшифровываем данные.
  if(!remoteBlob){
    try{remoteBlob=await fetchRemote()}catch(e){if(/Токен/.test(e.message)){pendingKey=key;return showNewToken()}$("#gerr").textContent=e.message;return}
    if(!remoteBlob){$("#gerr").textContent="Файл с данными не найден в репозитории";return}
  }
  let k=key&&cfg.salt===remoteBlob.salt?key:await deriveKey(lastPass,ub64(remoteBlob.salt));
  try{state=await decryptBlob(remoteBlob,k)}catch{failCount++;$("#gerr").textContent="Неверный мастер-пароль";extraReset();return}
  dataKey=k;dataSalt=remoteBlob.salt;
  try{await storeCfg()}catch{}
  try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");
    if(d&&d.salt===dataSalt&&d.at>(state.at||0)){const ds=await decryptBlob(d,dataKey);
      if(confirm("Нашлись несохранённые изменения с прошлого раза. Восстановить их?")){state=ds;dirty=true}else localStorage.removeItem(DRAFT_KEY)}}catch{}
  lastPass=null;enterApp();
}

}

const enc=new TextEncoder(),dec=new TextDecoder();
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));

async function deriveKey(p,salt){const base=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}

async function openVault(p){const k=await deriveKey(p,ub64(state.vault.salt));const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(state.vault.iv)},k,ub64(state.vault.ct));vaultKey=k;vaultItems=JSON.parse(dec.decode(pt))}

function emptyBox(text,btn){return `<div class="empty-state">${ico(cur,34)}<div>${text}</div>${btn?`<button class="btn add" data-act="add">${btn}</button>`:""}</div>`}
function renderSection(s){
  let items=state.items.filter(i=>i.sec===s.id);
  let h=hero(s.id,s.title,s.sub);
  if(s.engines&&s.engines.length>1){
    const opts=["all",...s.engines];
    h+=`<div class="filters">${opts.map(e=>`<button class="chip ${engFilter===e?"on":""}" data-eng="${e}">${e==="all"?"Все":ENG_LABEL[e]}</button>`).join("")}</div>`;
    if(engFilter!=="all"&&opts.includes(engFilter))items=items.filter(i=>(i.engine||"")===engFilter);
  }
  if(s.env){
    h+=`<div class="filters">${[["all","Прод и тест"],["prod","Прод"],["test","Тест"]].map(([v,l])=>`<button class="chip ${envFilter===v?"on":""}" data-envf="${v}">${l}</button>`).join("")}`;
    if(s.id==="projects")h+=`<span class="gap"></span>${[["all","Любой голос"],["m","♂ Мужской"],["f","♀ Женский"]].map(([v,l])=>`<button class="chip ${genFilter===v?"on":""}" data-gen="${v}">${l}</button>`).join("")}`;
    h+=`</div>`;
    if(envFilter!=="all")items=items.filter(i=>i.env===envFilter);
    if(s.id==="projects"&&genFilter!=="all")items=items.filter(i=>i.gender===genFilter);
  }
  if(!items.length)return h+emptyBox("Здесь пока пусто.","+ Добавить первую запись");
  const by=pinFirst;
  let groups;
  if(s.groupBy==="engine")groups=s.engines.map(e=>[ENG_LABEL[e],items.filter(i=>(i.engine||"")===e).sort(by)]);
  else if(s.groupBy==="projenv")groups=s.engines.flatMap(e=>[["prod","прод"],["test","тест"]].map(([v,l])=>[`${ENG_LABEL[e]}, ${l}`,items.filter(i=>i.engine===e&&i.env===v).sort(by)]));
  else groups=[["",items.sort(by)]];
  for(const [t,list] of groups){if(!list.length)continue;
    h+=t?`<div class="group">${esc(t)}<span class="cnt">${list.length}</span></div>`:'<div style="height:6px"></div>';
    h+=`<div class="list">${list.map(i=>rowHtml(i)).join("")}</div>`}
  return h;
}
function renderSearch(){
  const q=query.toLowerCase();
  const hit=state.items.filter(i=>[i.name,i.url,i.note,arr(i.asr).join(" "),arr(i.tts).join(" "),arr(i.llm).join(" ")].some(v=>(v||"").toLowerCase().includes(q)));
  hit.sort(pinFirst);
  const nh=state.notes.filter(n=>(n.text||"").toLowerCase().includes(q));
  const dh=state.docs.filter(d=>(d.title+" "+d.text).toLowerCase().includes(q)).sort(docSort);
  const vh=vaultItems?vaultItems.filter(v=>[v.where,v.login,v.note,v.url].some(x=>(x||"").toLowerCase().includes(q))):[];
  let h=`<div class="hero plain"><div class="hero-in"><div><h1>Поиск</h1><p class="sub">Найдено: ${hit.length+vh.length+nh.length+dh.length}${state.vault&&!vaultItems?". Пароли закрыты, в поиск они не попадают":""}</p></div></div></div>`;
  if(hit.length)h+=`<div class="list">${hit.map(i=>rowHtml(i,true)).join("")}</div>`;
  if(vh.length)h+=`<div class="group">Пароли<span class="cnt">${vh.length}</span></div><div class="list">${vh.map(vaultRow).join("")}</div>`;
  if(dh.length)h+=`<div class="group">База знаний<span class="cnt">${dh.length}</span></div><div class="list">${dh.map(docRow).join("")}</div>`;
  if(nh.length)h+=`<div class="group">Заметки<span class="cnt">${nh.length}</span></div><div class="board">${nh.map(stickyHtml).join("")}</div>`;
  if(!hit.length&&!vh.length&&!nh.length&&!dh.length)h+=`<div class="empty-state">Ничего не нашлось. Попробуй часть названия или адреса.</div>`;
  return h;
}
function vaultRow(v){
  const vis=shown.has(v.id),url=safeUrl(v.url);
  const nm=url?`<a class="name" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(v.where)}</a>`:`<span class="name">${esc(v.where)}</span>`;
  return `<div class="row"><div class="tag t0">${ico("vault",16)}</div><div style="min-width:0">${nm}
  <div class="meta"><span>${esc(v.login||"без логина")}</span><span class="pw">${vis?esc(v.password):"••••••••"}</span>${v.note?`<span>${esc(v.note)}</span>`:""}</div></div>
  <div class="acts"><button class="ib" title="${vis?"Скрыть":"Показать"}" data-show="${v.id}">${I.eye}</button><button class="ib" title="Скопировать логин" data-copy="${esc(v.login||"")}">${I.user}</button><button class="ib" title="Скопировать пароль" data-copypw="${v.id}">${I.copy}</button><button class="ib" title="Изменить" data-vedit="${v.id}">${I.edit}</button></div></div>`;
}

  const s=SEC.vault;let h=hero("vault",s.title,s.sub);

   <div class="f"><input type="password" id="mp1" placeholder="Мастер-пароль" autocomplete="new-password"></div><div class="f"><input type="password" id="mp2" placeholder="Ещё раз" autocomplete="new-password"></div>
   <button class="btn primary" data-act="vcreate" style="width:100%">Создать хранилище</button></div>`;

   <div class="f"><input type="password" id="mp" placeholder="Мастер-пароль" autocomplete="current-password"></div><button class="btn primary" data-act="vopen" style="width:100%">Открыть</button></div>`;

function renderLists(){
  const s=SEC.lists;let h=hero("lists",s.title,s.sub)+'<div class="lists">';
  for(const k of ["asr","tts","llm"]){
    h+=`<div><h3>${k.toUpperCase()}</h3><div class="lchips">${state.lists[k].length?state.lists[k].map((v,i)=>`<span class="lchip">${esc(v)}<button title="Удалить" data-ldel="${k}:${i}">×</button></span>`).join(""):'<span class="sub">Пока пусто</span>'}</div>
    <div class="addl"><input id="ladd-${k}" placeholder="Новый ${k.toUpperCase()}"><button class="btn" data-ladd="${k}">Добавить</button></div></div>`}
  return h+"</div>";
}

/* ---------- заметки и темы ---------- */
function stickyHtml(n){
  const rot=((parseInt(n.id,36)||0)%5-2)*0.8;
  const d=n.at?new Date(n.at).toLocaleDateString("ru-RU",{day:"numeric",month:"short"}):"";
  return `<div class="sticky c-${n.color||"yellow"} ${n.pinned?"pinned":""}" style="--rot:${rot}deg"><span class="sdate">${d}</span>
  <textarea data-note="${n.id}" placeholder="Напиши что-нибудь…">${esc(n.text||"")}</textarea>
  <div class="sbar"><div class="sdots">${NOTE_COLORS.map(c=>`<button class="sdot ${c===(n.color||"yellow")?"on":""}" style="background:${NOTE_HEX[c]}" data-ncolor="${n.id}:${c}" title="Цвет"></button>`).join("")}</div>
  <span style="display:flex;gap:10px"><button class="spin ${n.pinned?"on":""}" data-npin="${n.id}">${n.pinned?"Открепить":"Закрепить"}</button><button class="sdel" data-ndel="${n.id}">Удалить</button></span></div></div>`;
}
function renderFav(){
  const s=SEC.fav;let h=hero("fav",s.title,s.sub);
  const items=state.items.filter(i=>i.starred);
  if(!items.length)return h+`<div class="empty-state">${ico("fav",34)}<div>Пока пусто. Нажми звёздочку у любой записи, и она появится здесь.</div></div>`;
  for(const sec of SECTIONS){if(sec==="sep")continue;const list=items.filter(i=>i.sec===sec.id).sort(pinFirst);if(!list.length)continue;
    h+=`<div class="group">${esc(sec.title)}<span class="cnt">${list.length}</span></div><div class="list">${list.map(i=>rowHtml(i)).join("")}</div>`}
  return h;
}
function renderNotes(){
  const s=SEC.notes;
  return hero("notes",s.title,s.sub)+`<div class="board"><button class="newsticky" data-act="newnote">+ Новая заметка</button>${[...state.notes].reverse().sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).map(stickyHtml).join("")}</div>`;
}
function openThemes(){
  showDlg(`<h2>Тема оформления</h2><div class="themes">${THEMES.map(t=>`<button class="th ${state.theme===t.id?"on":""}" data-theme-pick="${t.id}">
   <div class="pv" style="background:${t.pv[0]}">${t.pv.slice(1).map((c,i)=>`<i style="background:${c};height:${[34,24,14][i]}px"></i>`).join("")}</div><div class="nm">${t.name}</div></button>`).join("")}</div>
   <div class="dlgfoot"><div class="r"><button class="btn primary" data-act="close">Готово</button></div></div>`,{kind:"themes"});
}

/* ---------- база знаний ---------- */
const projLabel=p=>`${p.name||"Без названия"} (${p.engine||"?"}, ${p.env==="test"?"тест":"прод"})`;
const projects=()=>state.items.filter(i=>i.sec==="projects").sort((a,b)=>(b.engine||"").localeCompare(a.engine||"")||(a.env||"").localeCompare(b.env||"")||(a.name||"").localeCompare(b.name||"","ru"));
const fmtDate=t=>t?new Date(t).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
const lines=t=>(t||"").split("\n").length;
function docRow(d){
  const ps=d.projects.map(id=>state.items.find(i=>i.id===id)).filter(Boolean);
  const first=(d.text||"").trim().split("\n")[0].slice(0,120);
  return `<div class="row ${d.pinned?"pinned":""}"><div class="tag t0">${ico("kb",16)}</div><div style="min-width:0">
   <button class="name" style="border:0;background:none;padding:0;cursor:pointer;text-align:left" data-dopen="${d.id}">${esc(d.title||"Без названия")}</button>${d.pinned?`<span class="mark">${ico("pin",14)}</span>`:""}
   <div class="meta">${ps.map(p=>`<span class="pchip">${esc(projLabel(p))}</span>`).join("")}<span>${lines(d.text)} строк</span><span>обновлено ${fmtDate(d.at)}</span>${d.history.length?`<span>версий: ${d.history.length+1}</span>`:""}</div>
   ${first?`<div class="meta" style="font-family:ui-monospace,Consolas,monospace;font-size:12px">${esc(first)}</div>`:""}</div>
   <div class="acts"><button class="ib pin ${d.pinned?"on":""}" title="Закрепить" data-dpin="${d.id}">${ico("pin",17)}</button><button class="ib" title="Скопировать текст" data-dcopy="${d.id}">${I.copy}</button><button class="ib" title="Открыть" data-dopen="${d.id}">${I.edit}</button></div></div>`;
}
const docSort=(a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.at||0)-(a.at||0);
function renderKb(){
  const s=SEC.kb;let h=hero("kb",s.title,s.sub);
  const ps=projects();
  h+=`<div class="filters"><button class="chip ${kbFilter==="all"?"on":""}" data-kbf="all">Все</button><button class="chip ${kbFilter==="none"?"on":""}" data-kbf="none">Без проекта</button>${ps.filter(p=>state.docs.some(d=>d.projects.includes(p.id))).map(p=>`<button class="chip ${kbFilter===p.id?"on":""}" data-kbf="${p.id}">${esc(p.name)}</button>`).join("")}</div>`;
  let docs=[...state.docs];
  if(kbFilter==="none")docs=docs.filter(d=>!d.projects.length);else if(kbFilter!=="all")docs=docs.filter(d=>d.projects.includes(kbFilter));
  if(!docs.length)return h+emptyBox("Документов пока нет.","+ Новый документ");
  return h+`<div class="list">${docs.sort(docSort).map(docRow).join("")}</div>`;
}
let kbFilter="all";
function openDoc(doc,presetProject){
  const isNew=!doc;
  doc=doc||{id:uid(),title:"",text:"",projects:presetProject?[presetProject]:[],history:[],at:0};
  const ps=projects();
  const vers=doc.history.length?`<div class="vers">Версия: <button type="button" class="chip on" data-dver="-1">Актуальная</button>${doc.history.map((v,i)=>`<button type="button" class="chip" data-dver="${i}">${i===0?"Предыдущая":"Старая"} · ${fmtDate(v.at)}</button>`).join("")}</div>`:"";
  const h=`<h2>${isNew?"Новый документ":"Документ"}</h2>
  <label class="f">Название<input id="d-title" value="${esc(doc.title)}" placeholder="Например: Промпт оператора, движок 4"></label>
  <div class="multi"><div class="mh"><b>ПРОЕКТЫ</b><span>можно несколько</span></div><div class="mopts" id="d-projs">${ps.length?ps.map(p=>`<button type="button" class="mopt ${doc.projects.includes(p.id)?"on":""}" data-mv="${p.id}">${esc(projLabel(p))}</button>`).join(""):'<span style="font-size:13px;color:var(--soft)">Проектов пока нет</span>'}</div></div>
  ${vers}<p class="verwarn" id="d-warn" hidden>Это старая версия, только для чтения. Можно скопировать её или вернуть.</p>
  <div class="docbar"><span id="d-info"></span><span class="r"><button type="button" data-act="dupload">Загрузить .txt</button><button type="button" data-act="ddownload">Скачать .txt</button><button type="button" data-act="dcopytxt">Копировать всё</button><button type="button" data-act="drestore" hidden>Вернуть эту версию</button></span></div>
  <textarea id="d-text" class="doctext" spellcheck="false" placeholder="Вставь сюда промпт или любой текст">${esc(doc.text)}</textarea>
  <div class="dlgfoot">${isNew?"":`<button class="btn danger" data-act="ddel">Удалить</button>`}<div class="r"><button class="btn" data-act="close">Закрыть</button><button class="btn primary" data-act="dsave">Сохранить</button></div></div>`;
  showDlg(h,{kind:"doc",doc,isNew,draft:doc.text,ver:-1},true);
  docInfo();
}
function docInfo(){const t=$("#d-text");if(t&&$("#d-info"))$("#d-info").textContent=`${lines(t.value)} строк · ${t.value.length} символов`}
function showVer(i){
  const c=dlgCtx,t=$("#d-text");
  if(c.ver===-1)c.draft=t.value;
  c.ver=i;
  document.querySelectorAll("[data-dver]").forEach(b=>b.classList.toggle("on",+b.dataset.dver===i));
  if(i===-1){t.value=c.draft;t.readOnly=false}else{t.value=c.doc.history[i].text;t.readOnly=true}
  $("#d-warn").hidden=i===-1;document.querySelector('[data-act="drestore"]').hidden=i===-1;docInfo();
}
function saveDoc(){
  const c=dlgCtx;if(c.ver!==-1)showVer(-1);
  const title=$("#d-title").value.trim()||"Без названия",text=$("#d-text").value;
  const projs=[...document.querySelectorAll("#d-projs .mopt.on")].map(b=>b.dataset.mv);
  let d=state.docs.find(x=>x.id===c.doc.id);
  if(!d){d={...c.doc,history:[]};state.docs.push(d)}
  if(!c.isNew&&text!==d.text){d.history.unshift({text:d.text,at:d.at||Date.now()});d.history=d.history.slice(0,5)}
  d.title=title;d.text=text;d.projects=projs;if(c.isNew||text!==c.doc.text||!d.at)d.at=Date.now();
  change();closeDlg();render();toast("Документ сохранён. Не забудь «Сохранить» на GitHub");
}
function openProjDocs(pid){
  const p=state.items.find(i=>i.id===pid);if(!p)return;
  const docs=state.docs.filter(d=>d.projects.includes(pid)).sort(docSort);
  const others=state.docs.filter(d=>!d.projects.includes(pid));
  showDlg(`<h2>Документы: ${esc(p.name)}</h2>
  <div class="dlist">${docs.length?docs.map(d=>`<button class="dl" data-dopen="${d.id}"><span><b>${esc(d.title||"Без названия")}</b><br><small>${lines(d.text)} строк · обновлено ${fmtDate(d.at)}${d.history.length?` · версий: ${d.history.length+1}`:""}</small></span><span style="color:var(--acc)">Открыть</span></button>`).join(""):'<p style="color:var(--soft);margin:0">К этому проекту пока ничего не привязано.</p>'}</div>
  ${others.length?`<label class="f">Привязать существующий<select id="pd-link"><option value="">Выбери документ…</option>${others.map(d=>`<option value="${d.id}">${esc(d.title||"Без названия")}</option>`).join("")}</select></label>`:""}
  <div class="dlgfoot"><div class="r"><button class="btn" data-act="close">Закрыть</button><button class="btn primary" data-pnew="${pid}">+ Новый документ</button></div></div>`,{kind:"pdocs",pid});
}

/* ---------- формы ---------- */
function multiStack(k,vals){vals=arr(vals);const all=[...new Set([...state.lists[k],...vals])];
  return `<div class="multi" data-multi="${k}"><div class="mh"><b>${k.toUpperCase()}</b><span>можно несколько</span></div><div class="mopts">${all.length?all.map(o=>`<button type="button" class="mopt ${vals.includes(o)?"on":""}" data-mv="${esc(o)}">${esc(o)}</button>`).join(""):'<span style="font-size:13px;color:var(--soft)">Список пуст, добавь первый вариант</span>'}</div>
  <div class="madd"><input placeholder="Новый ${k.toUpperCase()}" data-maddin="${k}"><button type="button" data-madd="${k}">Добавить</button></div></div>`}
function selectStack(k,val){const o=state.lists[k],all=val&&!o.includes(val)?[...o,val]:o;
  return `<label class="f">${k.toUpperCase()}<select id="f-${k}" data-stack="${k}"><option value="">—</option>${all.map(x=>`<option ${x===val?"selected":""}>${esc(x)}</option>`).join("")}<option value="__new">+ добавить новый…</option></select></label>`}
function openItem(it){
  const isNew=!it,secId=it?it.sec:cur,s=SEC[secId];
  it=it||{sec:secId,engine:s.engines?(engFilter!=="all"&&s.engines.includes(engFilter)?engFilter:s.engines[0]):"",...(s.env?{env:envFilter!=="all"?envFilter:(s.env===true?"prod":"")}:{}),...(s.status?{status:"ok"}:{})};
  let h=`<h2>${isNew?"Новая запись":"Изменить"}: ${esc(s.title)}</h2>
  <label class="f">Ссылка<input id="f-url" value="${esc(it.url||"")}" placeholder="https://..." inputmode="url"></label>
  <label class="f">Название<input id="f-name" value="${esc(it.name||"")}" placeholder="Подставится из ссылки, если оставить пустым"></label>`;
  if(s.engines||s.env||s.status){h+='<div class="frow">';
    if(s.engines)h+=`<label class="f">Движок<div class="seg" data-seg="engine">${s.engines.map(e=>`<button type="button" data-v="${e}" class="${(it.engine||"")===e?"on":""}">${e||"Общая"}</button>`).join("")}</div></label>`;
    if(s.env)h+=`<label class="f">Среда<div class="seg" data-seg="env">${(s.env===true?[]:[["","—"]]).concat([["prod","Прод"],["test","Тест"]]).map(([v,l])=>`<button type="button" data-v="${v}" class="${it.env===v?"on":""}">${l}</button>`).join("")}</div></label>`;
    if(s.status)h+=`<label class="f">Статус<div class="seg" data-seg="status">${[["ok","Работает"],["old","Старый"]].map(([v,l])=>`<button type="button" data-v="${v}" class="${(it.status||"ok")===v?"on":""}">${l}</button>`).join("")}</div></label>`;
    h+='</div>'}
  if(s.stack)h+=`<label class="f">Голос бота<div class="seg" data-seg="gender">${[["","Не указан"],["m","♂ Мужской"],["f","♀ Женский"]].map(([v,l])=>`<button type="button" data-v="${v}" class="${(it.gender||"")===v?"on":""}">${l}</button>`).join("")}</div></label>${multiStack("asr",it.asr)}${multiStack("tts",it.tts)}${multiStack("llm",it.llm)}`;
  h+=`<label class="f">Заметка<textarea id="f-note" placeholder="Для чего, клиент, с какой даты">${esc(it.note||"")}</textarea></label>
  <div class="dlgfoot">${isNew?"":`<button class="btn danger" data-act="del">Удалить</button>`}<div class="r"><button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="saveitem">Готово</button></div></div>`;
  showDlg(h,{kind:"item",it,isNew});
}
function openVaultItem(v){const isNew=!v;v=v||{};
  showDlg(`<h2>${isNew?"Новый пароль":"Изменить пароль"}</h2>
  <label class="f">Где (сайт, движок, сервис)<input id="v-where" value="${esc(v.where||"")}" placeholder="Движок 4, админка"></label>
  <label class="f">Ссылка<input id="v-url" value="${esc(v.url||"")}" placeholder="https://..."></label>

let dlgCtx=null;
function showDlg(h,ctx,wide){dlgCtx=ctx;$("#dlg").classList.toggle("wide",!!wide);$("#dlgbody").innerHTML=h;if(!$("#dlg").open)$("#dlg").showModal();setTimeout(()=>{const f=$("#dlgbody input");f&&f.focus()},30)}
function closeDlg(){$("#dlg").close();dlgCtx=null}

/* ---------- события ---------- */
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Скопировано")}catch{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Скопировано")}catch{toast("Не получилось скопировать")}a.remove()}}
document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.go){cur=d.go;query="";engFilter="all";envFilter="all";render();scrollTo(0,0);return}
  if(d.eng){engFilter=d.eng;render();return}
  if(d.gen){genFilter=d.gen;render();return}
  if(d.envf){envFilter=d.envf;render();return}
  if(d.kbf){kbFilter=d.kbf;render();return}
  if(d.dopen){openDoc(state.docs.find(x=>x.id===d.dopen));return}
  if(d.dcopy){copy(state.docs.find(x=>x.id===d.dcopy)?.text||"");return}
  if(d.dpin){const x=state.docs.find(y=>y.id===d.dpin);if(x){x.pinned=!x.pinned;change();render()}return}
  if(d.dver!==undefined){showVer(+d.dver);return}
  if(d.pdocs){openProjDocs(d.pdocs);return}
  if(d.pnew){openDoc(null,d.pnew);return}
  if(d.star){const it=state.items.find(i=>i.id===d.star);if(it){it.starred=!it.starred;change();render();toast(it.starred?"Добавлено в избранное":"Убрано из избранного")}return}
  if(d.pin){const it=state.items.find(i=>i.id===d.pin);if(it){it.pinned=!it.pinned;change();render();toast(it.pinned?"Закреплено сверху":"Откреплено")}return}
  if(d.npin){const n=state.notes.find(x=>x.id===d.npin);if(n){n.pinned=!n.pinned;change();render()}return}
  if(d.themePick){state.theme=d.themePick;applyTheme();change();document.querySelectorAll(".th").forEach(b=>b.classList.toggle("on",b===t));return}
  if(d.mv!==undefined&&t.classList.contains("mopt")){t.classList.toggle("on");return}
  if(d.madd){const inp=document.querySelector(`[data-maddin="${d.madd}"]`),v=inp.value.trim();if(!v)return;
    if(!state.lists[d.madd].includes(v)){state.lists[d.madd].push(v);change()}
    const box=document.querySelector(`[data-multi="${d.madd}"] .mopts`);let b=[...box.querySelectorAll(".mopt")].find(x=>x.dataset.mv===v);
    if(!b){if(!box.querySelector(".mopt"))box.innerHTML="";b=document.createElement("button");b.type="button";b.className="mopt";b.dataset.mv=v;b.textContent=v;box.appendChild(b)}
    b.classList.add("on");inp.value="";inp.focus();return}
  if(d.ncolor){const[id,c]=d.ncolor.split(":");const n=state.notes.find(x=>x.id===id);if(n){n.color=c;change();render()}return}
  if(d.ndel){if(confirm("Удалить заметку?")){state.notes=state.notes.filter(x=>x.id!==d.ndel);change();render()}return}
  if(d.copy!==undefined){copy(d.copy);return}
  if(d.edit){openItem(state.items.find(i=>i.id===d.edit));return}
  if(d.show){shown.has(d.show)?shown.delete(d.show):shown.add(d.show);render();return}
  if(d.copypw){copy(vaultItems.find(x=>x.id===d.copypw)?.password||"");return}
  if(d.vedit){openVaultItem(vaultItems.find(x=>x.id===d.vedit));return}
  if(d.ldel){const[k,i]=d.ldel.split(":");state.lists[k].splice(+i,1);change();render();return}
  if(d.ladd){const v=$("#ladd-"+d.ladd).value.trim();if(v&&!state.lists[d.ladd].includes(v)){state.lists[d.ladd].push(v);change();render();setTimeout(()=>$("#ladd-"+d.ladd)?.focus(),0)}return}
  if(t.closest(".seg")&&d.v!==undefined){t.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===t));return}
  switch(d.act){
    case "save":saveFile();break;
    case "gconnect":connect();break;
    case "gretry":start();break;
    case "gconn":openConn();break;
    case "csave":saveConn();break;
    case "cforget":if(confirm("Отключить это устройство? Данные на GitHub останутся, но здесь нужно будет заново ввести репозиторий и токен.")){if(dirty&&!confirm("Есть несохранённые изменения. Они пропадут. Продолжить?"))break;localStorage.removeItem(CFG_KEY);localStorage.removeItem(DRAFT_KEY);dirty=false;location.reload()}break;
    case "greset":if(confirm("Сбросить подключение на этом устройстве? Данные на GitHub не пострадают.")){localStorage.removeItem(CFG_KEY);cfg=null;failCount=0;showSetup()}break;
    case "gnewtoken":newToken();break;
    case "gunlock":unlock();break;
    case "gcreate":createNew();break;
    case "glock":if(dirty&&!confirm("Есть несохранённые изменения. Заблокировать без сохранения?"))break;dirty=false;dataKey=null;state=null;TOKEN=null;vaultKey=null;vaultItems=null;remoteBlob=null;start();break;
    case "forcesave":closeDlg();saveFile(true);break;
    case "takeremote":closeDlg();dirty=false;try{localStorage.removeItem(DRAFT_KEY)}catch{}(async()=>{try{remoteBlob=await fetchRemote();state=await decryptBlob(remoteBlob,dataKey);vaultKey=null;vaultItems=null;render();toast("Загружена свежая версия")}catch(e){toast("Не получилось: "+e.message)}})();break;
    case "themes":openThemes();break;
    case "newnote":{const n={id:uid(),text:"",color:NOTE_COLORS[state.notes.length%NOTE_COLORS.length],at:Date.now()};state.notes.push(n);change();render();setTimeout(()=>document.querySelector(`[data-note="${n.id}"]`)?.focus(),0);break}
    case "add":cur==="vault"?openVaultItem():cur==="kb"?openDoc():openItem();break;
    case "dsave":saveDoc();break;
    case "ddel":if(confirm("Удалить документ со всеми версиями?")){state.docs=state.docs.filter(x=>x.id!==dlgCtx.doc.id);change();closeDlg();render()}break;
    case "dcopytxt":copy($("#d-text").value);break;
    case "dupload":$("#txtFile").click();break;
    case "ddownload":{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("#d-text").value],{type:"text/plain;charset=utf-8"}));a.download=(($("#d-title").value.trim()||"document").replace(/[\\/:*?"<>|]/g,"_"))+".txt";document.body.appendChild(a);a.click();a.remove();break}
    case "drestore":{const c=dlgCtx,txt=c.doc.history[c.ver].text;c.draft=txt;showVer(-1);toast("Версия возвращена в редактор. Нажми «Сохранить»");break}
    case "close":if(dlgCtx?.kind==="doc"){const c=dlgCtx,t=c.ver===-1?$("#d-text").value:c.draft;if(t!==c.doc.text&&!confirm("Закрыть без сохранения? Изменения в тексте пропадут."))break}closeDlg();break;
    case "saveitem":{const{it,isNew}=dlgCtx,s=SEC[it.sec];const url=$("#f-url").value.trim();let name=$("#f-name").value.trim();
      if(!name&&!url){toast("Укажи ссылку или название");return}if(!name)name=autoName(url);
      const sv=k=>$(`[data-seg="${k}"] .on`)?.dataset.v;const n={...it,name,url,note:$("#f-note").value.trim()};
      if(s.engines)n.engine=sv("engine")??"";if(s.env)n.env=sv("env")||"";if(s.status)n.status=sv("status");
      if(s.stack){n.gender=sv("gender")||"";for(const k of ["asr","tts","llm"])n[k]=[...document.querySelectorAll(`[data-multi="${k}"] .mopt.on`)].map(b=>b.dataset.mv)}
      if(isNew){n.id=uid();state.items.push(n)}else state.items[state.items.findIndex(i=>i.id===it.id)]=n;
      change();closeDlg();render();break}
    case "del":if(confirm("Удалить запись?")){const delId=dlgCtx.it.id;state.docs.forEach(x=>x.projects=x.projects.filter(p=>p!==delId));state.items=state.items.filter(i=>i.id!==delId);change();closeDlg();render()}break;
    case "vcreate":{const a=$("#mp1").value,b=$("#mp2").value;if(a.length<4){toast("Минимум 4 символа");return}if(a!==b){toast("Пароли не совпадают");return}await createVault(a);render();toast("Хранилище создано. Не забудь нажать «Сохранить»");break}
    case "vopen":try{await openVault($("#mp").value);render()}catch{toast("Неверный мастер-пароль")}break;
    case "vlock":vaultKey=null;vaultItems=null;shown.clear();render();break;
    case "vsave":{const{v,isNew}=dlgCtx;const where=$("#v-where").value.trim();if(!where){toast("Укажи, где этот пароль");return}
      const n={...v,where,url:$("#v-url").value.trim(),login:$("#v-login").value,password:$("#v-pass").value,note:$("#v-note").value.trim()};
      if(isNew){n.id=uid();vaultItems.push(n)}else vaultItems[vaultItems.findIndex(x=>x.id===v.id)]=n;
      await sealVault();closeDlg();render();break}
    case "vdel":if(confirm("Удалить пароль?")){vaultItems=vaultItems.filter(x=>x.id!==dlgCtx.v.id);await sealVault();closeDlg();render()}break;
    case "import":$("#importFile").click();break;
    case "exportjson":{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:"application/json"}));a.download=`spravochnik-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();break}
  }
});
document.addEventListener("change",async e=>{const s=e.target;
  if(s.id==="pd-link"&&s.value){const doc=state.docs.find(x=>x.id===s.value);if(doc){doc.projects.push(dlgCtx.pid);change();openProjDocs(dlgCtx.pid);render();toast("Привязано")}return}
  if(s.id==="txtFile"){const f=s.files[0];if(f){const txt=await f.text();const ta=$("#d-text");if(ta&&!ta.readOnly){if(!ta.value||confirm("Заменить текст в редакторе содержимым файла?")){ta.value=txt;docInfo()}if(!$("#d-title").value.trim())$("#d-title").value=f.name.replace(/\.[^.]+$/,"")}}s.value="";return}if(s.dataset?.stack&&s.value==="__new"){const k=s.dataset.stack,v=(prompt(`Новый ${k.toUpperCase()}:`)||"").trim();
  if(v){if(!state.lists[k].includes(v)){state.lists[k].push(v);change()}const o=document.createElement("option");o.textContent=v;s.insertBefore(o,s.lastElementChild);s.value=v}else s.value=""}});
document.addEventListener("input",e=>{if(e.target.id==="q"){query=e.target.value.trim();render();return}
  if(e.target.id==="d-text"){docInfo();return}
  const nid=e.target.dataset?.note;if(nid){const n=state.notes.find(x=>x.id===nid);if(n){n.text=e.target.value;n.at=Date.now();change()}}});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"||(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="ы"){e.preventDefault();if(dlgCtx?.kind==="doc"){saveDoc()}saveFile();return}
  if(e.key==="Tab"&&e.target.id==="d-text"&&!e.target.readOnly){e.preventDefault();const t=e.target,a=t.selectionStart;t.setRangeText("  ",a,t.selectionEnd,"end");docInfo();return}
  if(e.key==="Enter"){const id=e.target.id;
    if(id==="m"){e.preventDefault();unlock();return}if(id==="m2"){e.preventDefault();createNew();return}if(id==="g-path"||id==="g-token"||id==="g-repo"){e.preventDefault();connect();return}if(id==="g-newtoken"){e.preventDefault();newToken();return}
    if(id==="mp"){e.preventDefault();$('[data-act="vopen"]').click()}
    if(id==="mp2"){e.preventDefault();$('[data-act="vcreate"]').click()}
    if(id?.startsWith("ladd-")){e.preventDefault();$(`[data-ladd="${id.slice(5)}"]`).click()}
    if(e.target.dataset?.maddin){e.preventDefault();document.querySelector(`[data-madd="${e.target.dataset.maddin}"]`).click();return}
    if(dlgCtx&&(dlgCtx.kind==="item"||dlgCtx.kind==="vault")&&e.target.tagName==="INPUT"){e.preventDefault();$(dlgCtx.kind==="vault"?'[data-act="vsave"]':'[data-act="saveitem"]').click()}}
  if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}
  if(e.key==="Escape"&&document.activeElement.id==="q"&&query){query="";render()}
});
$("#dlg").addEventListener("close",()=>{dlgCtx=null});
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
$("#importFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;
  try{let txt=await f.text();if(/<html/i.test(txt)){const m=txt.match(/<script id="appdata" type="application\/json">([\s\S]*?)<\/script>/);txt=m?m[1]:"null"}
    {const j=JSON.parse(txt);if(j&&j.ct&&!j.items)throw 0}
    const s=normalize(JSON.parse(txt));if(!s.items.length&&!s.vault)throw 0;
    if(!confirm(`Заменить текущие данные? В копии записей: ${s.items.length}.`))return;
    state=s;vaultKey=null;vaultItems=null;change();render();toast("Загружено. Нажми «Сохранить»");
  }catch{toast("Файл не похож на копию справочника")}e.target.value=""});

/* ---------- старт ---------- */
try{document.documentElement.dataset.theme=localStorage.getItem("spravochnik-theme")||"neon"}catch{}
cfg=loadCfg();
if(!window.crypto||!crypto.subtle)gate("<h2>Браузер не подходит</h2><p>Открой справочник по ссылке https:// в Chrome, Edge, Safari или Firefox.</p>");
else start();
</script>
</body>
</html>
